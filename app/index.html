<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Vayu</title>
		<!--
			Pre-paint appearance: apply the persisted accent, light/dark, UI font,
			and interface scale before React mounts, so the first frame isn't a
			flash of the wrong theme/size. Keys and font stacks mirror
			src/constants/storage-keys.ts + src/constants/appearance.ts; the
			useElectronTheme / useAppearance hooks remain the source of truth.
		-->
		<script>
			(function () {
				try {
					var el = document.documentElement;

					/*
					 * Platform, for the per-platform title-bar height in index.css
					 * (macOS runs 28px, Windows and Linux 32px). Stamped here rather
					 * than from React so the bar is never briefly the wrong height and
					 * everything below it never shifts. `electronAPI` is exposed at
					 * preload top level, which runs before this script.
					 */
					var plat = window.electronAPI && window.electronAPI.platform;
					if (plat === "darwin") el.setAttribute("data-platform", "mac");
					else if (plat === "win32") el.setAttribute("data-platform", "windows");
					else if (plat) el.setAttribute("data-platform", "linux");

					var scheme = localStorage.getItem("vayu-color-scheme");
					if (scheme) el.setAttribute("data-color-scheme", scheme);
					var source = localStorage.getItem("vayu-theme-source");
					var dark =
						source === "dark" ||
						((source === "system" || !source) &&
							window.matchMedia("(prefers-color-scheme: dark)").matches);
					if (dark) el.classList.add("dark");

					var fonts = {
						inter: '"Inter", system-ui, sans-serif',
						system: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif',
						mono: '"JetBrains Mono", "Consolas", "Monaco", monospace',
					};
					var font = localStorage.getItem("vayu-ui-font");
					if (font === "custom") {
						var cf = localStorage.getItem("vayu-ui-font-custom");
						if (cf && cf.trim()) {
							el.style.setProperty(
								"--font-sans",
								cf.indexOf(",") >= 0
									? cf
									: '"' +
											cf.replace(/["']/g, "") +
											'", "Space Grotesk", system-ui, sans-serif'
							);
						}
					} else if (fonts[font]) {
						el.style.setProperty("--font-sans", fonts[font]);
					}

					/*
						Interface scale is stored as the zoom factor itself. The three
						preset names it used to store still migrate here, because this
						script runs before the store that would rewrite them - a user
						on "comfortable" must not get a frame at 100% first.
					*/
					var legacyScales = { compact: 0.9, default: 1, comfortable: 1.1 };
					var savedScale = localStorage.getItem("vayu-ui-scale");
					var factor = Object.prototype.hasOwnProperty.call(legacyScales, savedScale)
						? legacyScales[savedScale]
						: parseFloat(savedScale);
					if (factor > 0) {
						/* Mirrors clampScale in src/constants/appearance.ts. */
						factor = Math.min(2, Math.max(0.8, Math.round(factor * 10) / 10));
						if (window.electronAPI && window.electronAPI.setZoomFactor) {
							window.electronAPI.setZoomFactor(factor);
						} else {
							el.style.zoom = String(factor);
						}
					}

					var radii = { square: "0rem", rounded: "0.75rem" };
					var radius = radii[localStorage.getItem("vayu-ui-radius")];
					if (radius) el.style.setProperty("--radius", radius);
				} catch (e) {
					/* localStorage unavailable - the hooks apply on mount */
				}
			})();
		</script>
		<!--
			No font <link> here on purpose. The six faces are bundled and declared
			in src/fonts.css: a stylesheet in this head is render-blocking, and the
			window is shown on ready-to-show, so a fetch here is a fetch the window
			waits for. See src/fonts.css.
		-->
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
