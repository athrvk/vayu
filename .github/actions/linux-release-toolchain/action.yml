name: Linux release toolchain
description: >
  Check the Linux release image is the Ubuntu 22.04 one with GCC 13, and
  select GCC 13 as the compiler CMake and vcpkg pick up.

# The Linux release is built on the oldest supported Ubuntu LTS, because a
# binary asks the loader for the glibc it was linked against and runs on that
# release and every later one, never an earlier one. 0.37.0 was built on 24.04
# and failed to start on 22.04 with "version `GLIBC_2.38' not found".
#
# The 22.04 userland comes from the `vayu-linux-build` container image
# (.github/linux-build/Dockerfile), run on an ubuntu-26.04 runner, not from
# the ubuntu-22.04 runner image, which GitHub removes on 2027-04-17 (#2634).
# The image holds the build tools and GCC 13, so no job installs anything from
# Launchpad: .github/workflows/linux-build-image.yml is the only place that
# does, and only when the Dockerfile changes. The jobs name the image by
# digest, so a rebuilt image reaches them through a reviewed change.
#
# 22.04 ships GCC 12, which cannot build the engine (C++23; CLAUDE.md asks for
# GCC 13+), so the image carries GCC 13 from the Ubuntu toolchain PPA. Its
# libstdc++ is newer than 22.04's, which is why engine/CMakeLists.txt links the
# C++ runtime statically on Linux; scripts/check-linux-glibc.sh asserts both
# halves on the built binary.
#
# An action rather than a step because three workflows need the identical
# compiler: release.yml builds the artifact, cache-warm.yml fills the vcpkg and
# sccache entries the release reads (a different compiler misses both caches),
# and pr-tests.yml builds the same configuration on every engine pull request
# so a break surfaces there rather than on a tag.
#
# Raising the baseline to the next LTS means changing the Dockerfile's base
# image, the image digest and the `container-ubuntu-*` matrix label in those
# three workflows, the version check below, and VAYU_LINUX_GLIBC_FLOOR's
# default in scripts/check-linux-glibc.sh, together. See
# docs/engine/building.md.

runs:
  using: composite
  steps:
    - name: Select GCC 13 from the build image
      shell: bash
      run: |
        set -euo pipefail
        . /etc/os-release
        # The floor this toolchain exists to hold is the glibc of *this*
        # release. On a newer image the build would succeed and quietly raise
        # the floor again, which is the failure being fixed.
        if [ "${ID:-}" != "ubuntu" ] || [ "${VERSION_ID:-}" != "22.04" ]; then
          echo "::error::The Linux release toolchain is pinned to Ubuntu 22.04, and this job runs on ${PRETTY_NAME:-unknown}. Run it in the vayu-linux-build container, or raise the baseline everywhere at once (see docs/engine/building.md)." >&2
          exit 1
        fi
        # Never fetch the compiler here: a missing one means the job runs on
        # the wrong image, and falling back to Launchpad would hide that.
        if ! command -v g++-13 >/dev/null 2>&1 || ! command -v gcc-13 >/dev/null 2>&1; then
          echo "::error::g++-13 is missing. The job must run in the vayu-linux-build image (.github/linux-build/Dockerfile), which carries GCC 13." >&2
          exit 1
        fi
        g++-13 --version | head -1
        # CMake reads CC/CXX on a fresh configure, and vcpkg builds its ports
        # through the same toolchain, so both the dependencies and the engine
        # are compiled by GCC 13.
        echo "CC=gcc-13" >> "$GITHUB_ENV"
        echo "CXX=g++-13" >> "$GITHUB_ENV"
