name: Linux release toolchain
description: >
  Stand up the environment the Linux release is built in - the build tools a
  bare Ubuntu 22.04 lacks, and GCC 13 as the compiler CMake and vcpkg pick up.

# The Linux release is built on the oldest supported Ubuntu LTS, because a
# binary asks the loader for the glibc it was linked against and runs on that
# release and every later one, never an earlier one. 0.37.0 was built on 24.04
# and failed to start on 22.04 with "version `GLIBC_2.38' not found".
#
# The 22.04 userland comes from the `ubuntu:22.04` container image, run on an
# ubuntu-24.04 runner, not from the ubuntu-22.04 runner image, which GitHub
# removes on 2027-04-17 (#2634). The image holds the floor as long as Docker
# Hub publishes it; the runner only hosts it. A bare image has none of the
# runner image's tools, so this installs what the jobs below it use, and runs
# as root there with no sudo (it still uses sudo when it is not root).
#
# 22.04 ships GCC 12, which cannot build the engine (C++23; CLAUDE.md asks for
# GCC 13+), so GCC 13 comes from the Ubuntu toolchain PPA. Its libstdc++ is
# newer than 22.04's, which is why engine/CMakeLists.txt links the C++ runtime
# statically on Linux; scripts/check-linux-glibc.sh asserts both halves on the
# built binary.
#
# An action rather than a step because three workflows need the identical
# compiler: release.yml builds the artifact, cache-warm.yml fills the vcpkg and
# sccache entries the release reads (a different compiler misses both caches),
# and pr-tests.yml builds the same configuration on every engine pull request
# so a break surfaces there rather than on a tag.
#
# Raising the baseline to the next LTS means changing the container image and
# its `container-ubuntu-*` matrix label in those three workflows, the version
# check below, and VAYU_LINUX_GLIBC_FLOOR's default in
# scripts/check-linux-glibc.sh, together. See docs/engine/building.md.

runs:
  using: composite
  steps:
    - name: Install the build tools and GCC 13, and select it
      shell: bash
      run: |
        set -euo pipefail
        . /etc/os-release
        # The floor this toolchain exists to hold is the glibc of *this*
        # release. On a newer image the build would succeed and quietly raise
        # the floor again, which is the failure being fixed.
        if [ "${ID:-}" != "ubuntu" ] || [ "${VERSION_ID:-}" != "22.04" ]; then
          echo "::error::The Linux release toolchain is pinned to Ubuntu 22.04, and this job runs on ${PRETTY_NAME:-unknown}. Run it in the ubuntu:22.04 container, or raise the baseline everywhere at once (see docs/engine/building.md)." >&2
          exit 1
        fi

        as_root() {
          if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo "$@"; fi
        }
        apt_install() {
          as_root env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends "$@"
        }

        # What the runner image used to provide and these jobs use: vcpkg's
        # bootstrap and ports (curl, zip, unzip, tar, pkg-config, perl for
        # OpenSSL, the autotools for libsodium), the .deb packaging
        # (xz-utils), the artifact checksums (perl's shasum), the glibc check
        # (binutils, via build-essential), and add-apt-repository below. git
        # and zstd are installed before checkout, and CMake and Ninja come
        # from vcpkg once it is bootstrapped (see the workflows).
        as_root apt-get update
        apt_install \
          build-essential \
          pkg-config \
          ca-certificates \
          curl \
          zip \
          unzip \
          tar \
          xz-utils \
          perl \
          python3 \
          autoconf \
          autoconf-archive \
          automake \
          libtool \
          gnupg \
          software-properties-common

        if ! command -v g++-13 >/dev/null 2>&1; then
          as_root add-apt-repository -y ppa:ubuntu-toolchain-r/test
          as_root apt-get update
          apt_install gcc-13 g++-13
        fi
        g++-13 --version | head -1
        # CMake reads CC/CXX on a fresh configure, and vcpkg builds its ports
        # through the same toolchain, so both the dependencies and the engine
        # are compiled by GCC 13.
        echo "CC=gcc-13" >> "$GITHUB_ENV"
        echo "CXX=g++-13" >> "$GITHUB_ENV"
