name: Warm build cache

# Populates the vcpkg binary cache in the **default-branch cache scope**, which
# is the only scope a tagged release build can read.
#
# GitHub Actions caches are ref-scoped, and the rules are unforgiving:
#
#   - a run can restore caches from its own ref and from the default branch;
#   - a run **cannot** restore a cache created for a *different tag*;
#   - a `pull_request` run's cache is written to `refs/pull/N/merge` and can
#     only be restored by re-runs of that same pull request - not by the base
#     branch, not by other pull requests.
#
# See https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching
# ("Restrictions for accessing a cache").
#
# So `pr-tests.yml`, which runs only on `pull_request`, writes caches that
# nothing else can ever read, and `release.yml`, which runs on a tag push, can
# read only its own (empty, first-run) tag scope plus `refs/heads/master`. Until
# this workflow existed the *only* thing writing to the master scope was
# `codeql.yml` - Linux-only, and deliberately sccache-less. That is why the
# macOS and Windows release legs had never once seen a warm dependency cache,
# and why v0.17.0 built curl, openssl and libsodium from source on all three
# platforms. `restore-keys` does not help: it is a key-prefix fallback *within*
# the scopes a run can already read, not a way out of the scope boundary.
#
# Also warmed here: an engine compile that writes sccache entries to the
# **default-branch scope**, the same store the release build reads. This used to
# be excluded on purpose, and the reasoning is worth keeping because it explains
# exactly when the warming pays off. sccache is content-addressed on the
# preprocessed text of each translation unit plus its compile flags, so a warm
# entry only serves a build that preprocesses to the same bytes. A version bump
# changes `VAYU_VERSION_STRING`, so while that string reached ~68 translation
# units - `engine/include/vayu/core/constants.hpp` built `DEFAULT_USER_AGENT`
# from it and ~46 files included that header - a release commit missed by
# construction no matter how warm master was. The one time it ever hit, 98.42%
# on the v0.16.0 retry, the *same tag* had already compiled the *same commit* in
# a failed attempt an hour earlier - which is precisely the warm-same-commit
# scope this job now recreates on purpose.
#
# The narrowing shipped in a672f79 (#659 item 5, released in 0.18.0): the version
# now sits behind a declaration in `core/user_agent.hpp`, so only
# `user_agent.cpp` re-preprocesses on a bump and the rest of the tree is
# byte-identical across releases. Warming triggered by the `VERSION` change on
# master therefore fills the master scope with the same preprocessed text the tag
# build asks for. It also serves the first push of every pull request, which can
# read the default-branch scope but not another pull request's. sccache uses the
# GHA backend (`SCCACHE_GHA_ENABLED`), which is ref-scoped just like the vcpkg
# archives, and is separate from the vcpkg files backend used below.
#
# vcpkg, by contrast, is pure win: its ABI hash covers the ports, the triplet
# and the compiler, and *not* the top-level manifest, so the dependency
# archives stay valid across every release forever.

on:
  # vcpkg archives need rebuilding when the dependency set or the vcpkg baseline
  # changes; the engine sccache scope needs rewarming when `VERSION` changes,
  # because that is the one edit a release makes to the engine's preprocessed
  # text (see the top-of-file note). `VERSION` is the high-value, low-cost
  # trigger: the release PR's merge commit is byte-identical to the tree the tag
  # build compiles, so a warm run on the bump fills exactly the keys the release
  # asks for. `engine/**` would additionally keep the scope warm between releases
  # and serve first-push PR builds, at ~25 min of runner time per engine merge;
  # left out for now as the optional half of the trade.
  push:
    branches: [master]
    paths:
      - 'engine/vcpkg.json'
      - 'app/pnpm-lock.yaml'
      - 'VERSION'
      - '.github/workflows/cache-warm.yml'
  # The guard below is cheap and catches the regressions that would quietly
  # switch this workflow off, so it runs before they can merge.
  pull_request:
    branches: [master]
    paths:
      - 'engine/vcpkg.json'
      - '.github/workflows/*.yml'
      - 'build.py'
  # Weekly, because GitHub evicts cache entries that have not been *accessed*
  # in 7 days. Reads from pull requests normally keep the entry alive, so this
  # is a backstop for quiet weeks rather than the main path - and a hit makes
  # the job a ~1 minute no-op.
  schedule:
    - cron: '0 6 * * 1'
  # Lets the first seeding happen on demand rather than waiting for the next
  # dependency change.
  workflow_dispatch:

# NOT `cancel-in-progress: true`. A cancelled run saves nothing, and this
# workflow exists solely for its save step - cancelling it is indistinguishable
# from never running it. `codeql.yml` cancels, which is why a burst of merges
# leaves the master scope unrefreshed; that is correct for an analysis job and
# wrong for this one.
concurrency:
  group: cache-warm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A warming job whose cache key does not match the key of the job it is
  # warming is dead weight that still costs runner minutes, and nothing would
  # report it - the release build would simply go on missing. So the key is
  # asserted identical across every workflow that caches vcpkg, rather than
  # trusted to stay in step by hand.
  guard:
    name: Cache key agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assert every workflow shares one vcpkg cache key
        shell: bash
        run: |
          set -euo pipefail
          # Matched as a whole `key:` line, anchored. Two traps this avoids: a
          # token pattern such as "vcpkg-" followed by a non-space class stops
          # at the first space, so it would compare only the runner-os prefix
          # and pass happily while the rest of the key diverged; and an
          # unanchored pattern matches this step's own text in this very file,
          # so the guard would end up grading its own source instead of the
          # workflows.
          #
          # Note also that nothing in this script may spell an opening GitHub
          # expression delimiter in prose. This is a `run:` block, so Actions
          # scans it for expressions and rejects the whole *file* if one is
          # left unclosed - which is exactly how the first version of this
          # comment took the workflow down before any job could start.
          #
          # codeql.yml hardcodes `Linux` where the others interpolate
          # `runner.os`; it only ever runs on ubuntu, so those are the same
          # string. Normalise that one difference, require exact equality for
          # everything else.
          # sanitizers.yml and engine-tidy-scan.yml carry the same pin and were
          # outside this list until the 0.24.0 baseline bump found them: a bump
          # that updated only the guarded four would have left them checking out
          # an older vcpkg while resolving against the new manifest baseline,
          # which is the exact divergence the second half of this step rejects.
          files=(release.yml pr-tests.yml codeql.yml cache-warm.yml \
                 sanitizers.yml engine-tidy-scan.yml)
          keys=() commits=()
          for f in "${files[@]}"; do
            p=".github/workflows/$f"
            key=$(grep -oE '^[[:space:]]*key: vcpkg-.*$' "$p" | head -1 \
                  | sed -E 's/^[[:space:]]*key: //; s/vcpkg-Linux-/vcpkg-\$\{\{ runner.os \}\}-/')
            commit=$(grep -oE "VCPKG_COMMIT: '[0-9a-f]{40}'" "$p" | head -1)
            # A guard that matched nothing would pass forever. Fail instead.
            if [ -z "$key" ] || [ -z "$commit" ]; then
              echo "::error::$p has no vcpkg cache key line or no VCPKG_COMMIT - this guard just stopped guarding it." >&2
              exit 1
            fi
            keys+=("$key"); commits+=("$commit")
            echo "  $f"
            echo "      $key"
            echo "      $commit"
          done
          for i in "${!files[@]}"; do
            if [ "${keys[$i]}" != "${keys[0]}" ] || [ "${commits[$i]}" != "${commits[0]}" ]; then
              echo "::error::${files[$i]} disagrees with ${files[0]} on the vcpkg cache key or baseline. They must match exactly, or the warmed cache is unreachable from the build that needs it." >&2
              exit 1
            fi
          done
          echo "All ${#files[@]} workflows agree."

          # The workflows agreeing with each other is only half of it.
          # The commit they check vcpkg out at must also be the commit
          # `engine/vcpkg.json` resolves dependency versions against - they are
          # the same number written in two places, and nothing compared them
          # until now. Diverged, CI resolves versions from the manifest's
          # baseline while building against a different clone's port files, and
          # the mismatch surfaces as an unexplained platform failure rather
          # than as the config error it is.
          baseline=$(python3 -c "import json; print(json.load(open('engine/vcpkg.json'))['builtin-baseline'])")
          pinned=$(printf '%s' "${commits[0]}" | grep -oE '[0-9a-f]{40}')
          if [ "$baseline" != "$pinned" ]; then
            echo "::error file=engine/vcpkg.json::builtin-baseline ($baseline) and the workflows' VCPKG_COMMIT ($pinned) disagree. Bump them together." >&2
            exit 1
          fi
          echo "engine/vcpkg.json builtin-baseline agrees: $baseline"

      - name: Assert every workflow resolves the same pnpm store key
        shell: bash
        run: |
          set -euo pipefail
          # setup-node builds its own key from the runner OS, the arch, the
          # package manager and a hash of `cache-dependency-path`. Only the last
          # is ours to get wrong, so that is what is asserted. Anchored to the
          # start of a YAML line for the same reason as the vcpkg check above:
          # unanchored, the pattern would match this step's own text in this
          # file and the guard would grade itself.
          files=(release.yml pr-tests.yml cache-warm.yml)
          deps=()
          for f in "${files[@]}"; do
            p=".github/workflows/$f"
            dep=$(grep -E "^[[:space:]]*cache: 'pnpm'" -A1 "$p" \
                  | grep -oE "^[[:space:]]*cache-dependency-path: .*" | head -1 \
                  | sed -E 's/^[[:space:]]*cache-dependency-path: //')
            if [ -z "$dep" ]; then
              echo "::error::$p declares no pnpm cache-dependency-path - this guard just stopped guarding it." >&2
              exit 1
            fi
            deps+=("$dep")
            echo "  $f  $dep"
          done
          for i in "${!files[@]}"; do
            if [ "${deps[$i]}" != "${deps[0]}" ]; then
              echo "::error::${files[$i]} hashes a different lockfile than ${files[0]} for its pnpm cache, so the warmed store is unreachable from the build that needs it." >&2
              exit 1
            fi
          done
          echo "All ${#files[@]} workflows agree."

      - name: Assert engine/vcpkg.json carries no version field
        shell: bash
        run: |
          set -euo pipefail
          # `version` is optional for a top-level (consuming) manifest and
          # nothing reads it - the engine's version lives in VERSION,
          # CMakeLists.txt and version.hpp. It is excluded from vcpkg's ABI
          # hash, so it never invalidated a real dependency; it only ever
          # invalidated the *cache key*, which hashes the file whole. Bumping
          # it on every release is what guaranteed a cold cache at exactly the
          # moment a warm one mattered most. build.py enforces the same rule at
          # bump time; this catches a hand edit.
          if python3 -c "import json,sys; sys.exit(0 if 'version' in json.load(open('engine/vcpkg.json')) else 1)"; then
            echo "::error file=engine/vcpkg.json::Remove the 'version' field - it is hashed into the CI vcpkg cache key, so bumping it makes every release rebuild every dependency from source." >&2
            exit 1
          fi
          echo "engine/vcpkg.json has no version field."

      - name: Assert the warm engine compile matches release.yml's
        shell: bash
        run: |
          set -euo pipefail
          # The warm job now compiles the engine to fill the master sccache
          # scope, and that only helps a release if it compiles the SAME presets
          # release.yml compiles, through the same compiler launcher and the same
          # sccache backend. sccache is content-addressed on preprocessed text
          # plus compile flags, so a preset or launcher drift produces disjoint
          # keys that look warm and hit nothing. Asserted here rather than
          # trusted, exactly like the vcpkg key above.
          rel=".github/workflows/release.yml"
          warm=".github/workflows/cache-warm.yml"

          # 1. Same set of production presets. Extracted only from YAML preset
          #    keys, so this guard grades the workflows and not its own prose -
          #    the same self-grading trap the vcpkg checks avoid (my own lines
          #    start with `grep`/`for`, never with a `preset:` key). The
          #    `${{ matrix.preset }}` lines carry no literal token and drop out;
          #    the concrete tokens come from the matrix `include` blocks and the
          #    per-arch macOS steps.
          extract_presets() {
            grep -oE '^[[:space:]]*(configurePreset|buildPreset|preset): [a-z0-9-]+' "$1" \
              | grep -oE '[a-z]+-prod(-[a-z0-9]+)?' | sort -u
          }
          rel_presets=$(extract_presets "$rel")
          warm_presets=$(extract_presets "$warm")
          if [ -z "$rel_presets" ] || [ -z "$warm_presets" ]; then
            echo "::error::Found no production presets in $rel or $warm - this guard just stopped guarding them." >&2
            exit 1
          fi
          if [ "$rel_presets" != "$warm_presets" ]; then
            echo "::error::$warm warms a different production preset set than $rel compiles, so the warmed sccache keys are unreachable from the release build." >&2
            echo "release.yml presets:"    >&2; echo "$rel_presets"  >&2
            echo "cache-warm.yml presets:" >&2; echo "$warm_presets" >&2
            exit 1
          fi
          echo "Production presets agree: $(echo "$rel_presets" | tr '\n' ' ')"

          # 2. Same sccache backend and compiler launcher in both workflows.
          #    Each pattern is anchored to the real YAML/`run:` line it matches;
          #    the pattern strings in this array start with a quote, not with the
          #    token, so grepping cache-warm.yml for them cannot match this step.
          patterns=(
            "^[[:space:]]*SCCACHE_GHA_ENABLED:[[:space:]]*.true."
            '^[[:space:]]*echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"'
            '^[[:space:]]*echo "CMAKE_C_COMPILER_LAUNCHER=sccache"'
          )
          for f in "$rel" "$warm"; do
            for p in "${patterns[@]}"; do
              if ! grep -qE "$p" "$f"; then
                echo "::error::$f is missing a line matching /$p/ - the warm compile and the release build must share one sccache backend and launcher, or they key differently." >&2
                exit 1
              fi
            done
          done
          echo "sccache backend and compiler launcher agree across both workflows."

  warm:
    name: Warm vcpkg + engine cache on ${{ matrix.os }}
    # Guard first: if the keys disagree, warming the wrong key helps nobody.
    needs: guard
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            preset: linux-prod
          - os: windows-latest
            preset: windows-prod
          # macOS is the one platform where the release matrix is not the same
          # shape as the pull-request matrix: release.yml builds arm64 and x64
          # separately and lipos them together, so both triplets' dependencies
          # and object files have to be warm for a release to be warm. Handled by
          # the second build step below.
          - os: macos-latest
            preset: macos-prod-arm64
    timeout-minutes: 90
    env:
      # Keep these byte-identical to release.yml and pr-tests.yml. The `guard`
      # job above fails the build if they drift. `SCCACHE_GHA_ENABLED` selects
      # the ref-scoped GHA backend, so the entries this compile produces land in
      # the master scope a tag build reads - the whole point of warming here.
      VCPKG_COMMIT: '114d9fe62faf35856b45cf55cb93b57028a45d63'
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-archives,readwrite'
      SCCACHE_GHA_ENABLED: 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            build-essential \
            pkg-config \
            ca-certificates \
            autoconf \
            autoconf-archive \
            automake \
            libtool

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        # Same set release.yml installs: vcpkg builds libsodium from source
        # through its autotools path and runs autoreconf first.
        run: |
          command -v ninja || brew install ninja
          for pkg in autoconf autoconf-archive automake libtool; do
            brew list --formula "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: Cache vcpkg compiled packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('engine/vcpkg.json') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('engine/vcpkg.json') }}-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'
          vcpkgJsonGlob: 'engine/vcpkg.json'

      # sccache, set up exactly as release.yml and pr-tests.yml do (the guard job
      # asserts the launcher and backend stay in step). The compile below runs
      # through it and its entries land in the master GHA scope, so a tag build -
      # and the first push of every pull request - reads them back.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure sccache compiler launcher
        shell: bash
        run: |
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"

      # Configure AND build. Configuring runs vcpkg in manifest mode, which
      # populates `.vcpkg-archives`; building compiles the engine through sccache,
      # which is what fills the master scope the release reads (see the
      # top-of-file note). Both presets carry `buildPreset` so the same object
      # files a release compiles are the ones warmed here - the guard asserts the
      # preset set matches release.yml's.
      - name: Warm vcpkg archives and the engine sccache scope
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/engine/CMakeLists.txt'
          configurePreset: ${{ matrix.preset }}
          buildPreset: ${{ matrix.preset }}
          configurePresetAdditionalArgs: "['-DVAYU_BUILD_TESTS=ON']"

      # The second macOS triplet. release.yml builds x64 through Rosetta and
      # lipos it with arm64; without this the x64 half of every release still
      # compiles its dependencies and its sources from cold, and macOS stays the
      # long pole.
      - name: Warm vcpkg archives and the engine sccache scope (macOS x64)
        if: runner.os == 'macOS'
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/engine/CMakeLists.txt'
          configurePreset: macos-prod-x64
          buildPreset: macos-prod-x64
          configurePresetAdditionalArgs: "['-DVAYU_BUILD_TESTS=ON']"

      - name: Assert the warm compile fed sccache
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats
          # A warm run that compiled nothing wrote nothing to the scope a release
          # reads, and would otherwise look exactly like success - the same
          # non-empty-scan discipline the vcpkg archive count enforces below. The
          # text field is parsed rather than the JSON so a stats-format change on
          # a future sccache cannot silently break the check.
          requests=$(sccache --show-stats \
            | awk '$1=="Compile" && $2=="requests" && $3 ~ /^[0-9]+$/ {print $3; exit}')
          if [ -z "${requests:-}" ]; then
            echo "::error::Could not read sccache's compile-request count from --show-stats." >&2
            exit 1
          fi
          echo "sccache handled $requests compile request(s)."
          if [ "$requests" -eq 0 ]; then
            echo "::error::sccache processed zero compile requests - the engine did not compile through it, so the master scope was not warmed." >&2
            exit 1
          fi

      - name: Report what the cache now holds
        shell: bash
        run: |
          count=$(find .vcpkg-archives -type f -name '*.zip' 2>/dev/null | wc -l | tr -d ' ')
          size=$(du -sh .vcpkg-archives 2>/dev/null | cut -f1)
          echo "### Warmed \`${{ runner.os }}\` vcpkg cache" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Packages archived: \`${count:-0}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Archive size: \`${size:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"
          # An empty archive directory means the configure step never ran vcpkg
          # and this workflow saved nothing useful - which would otherwise look
          # exactly like success.
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::No vcpkg archives were produced - nothing was warmed." >&2
            exit 1
          fi

  # The same scope problem, one layer up. `actions/setup-node` caches the pnpm
  # store under a key it derives itself - `node-cache-<os>-<arch>-pnpm-<hash of
  # the lockfile>` - and the two workflows that use it write only to scopes a
  # release cannot read: pr-tests.yml to `refs/pull/N/merge`, release.yml to its
  # own throwaway tag scope. So every release re-resolved and re-downloaded the
  # whole dependency tree and then spent ~99 MB uploading a store nothing would
  # ever read back. v0.17.1 did exactly that on both Linux and Windows
  # ("Cache saved with the key: node-cache-...", i.e. no hit).
  #
  # Separate job rather than more steps on `warm` above: the two caches are
  # invalidated by different files, and folding them together would mean a
  # lockfile bump paying for a cmake configure and a dependency bump paying for
  # a pnpm install. Both are cheap on a hit, so both jobs still run on either
  # trigger - but the split keeps each job's name honest about what it did.
  warm-node:
    name: Warm pnpm store on ${{ matrix.os }}
    # Not because the guard checks anything about pnpm - it does not - but a
    # workflow that cannot agree with itself about a cache key should not be
    # spending runner minutes on any cache at all.
    needs: guard
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # pnpm first, then setup-node: setup-node shells out to pnpm to locate the
      # store it is going to cache, so the order is load-bearing. This mirrors
      # release.yml and pr-tests.yml exactly, which is the point - setup-node
      # derives the cache key from the runner OS, the arch, the package manager
      # and the hash of `cache-dependency-path`, so matching those inputs is
      # what makes the entry this job writes the same one they read. The guard
      # job asserts the dependency path has not drifted apart.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      # setup-node's post step saves the store, but only if the store has
      # anything in it - restoring an empty one would be worse than useless, so
      # the install has to actually run.
      - name: Populate the pnpm store
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Report what the store now holds
        shell: bash
        run: |
          store=$(pnpm store path 2>/dev/null || true)
          if [ -z "$store" ] || [ ! -d "$store" ]; then
            echo "::error::pnpm reported no store path - nothing was warmed." >&2
            exit 1
          fi
          size=$(du -sh "$store" 2>/dev/null | cut -f1)
          echo "### Warmed \`${{ runner.os }}\` pnpm store" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Store path: \`$store\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Store size: \`${size:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"
