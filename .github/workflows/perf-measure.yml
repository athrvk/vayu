name: Perf Measure

# Per-platform performance measurement for the #1143 program (filed as #1162).
#
# The 2026-08-30 sweep could only measure Linux, so every per-platform magnitude
# in that program's sub-issues is code-derived. This runs the same method on the
# Windows and macOS runners the repo already pays for, and doubles as the
# standing harness #1143's exit criterion needs ("startup re-measured after the
# #1144-#1149 cluster lands, per platform").
#
# It measures; it does not gate. There are no thresholds, nothing here fails a
# build on a number, and no ordinary pull request runs it - humans compare runs.
#
# Deliberately out of scope, so nobody looks for it here:
#   - Deep power measurement for #1161's idle-timer question (powercfg /energy,
#     ETW). Shared CI runners cannot measure it meaningfully; that half of #1161
#     stays honestly unmeasured, and #1161 says so.
#   - The CURLSSLOPT_NATIVE_CA handshake delta - it needs a TLS target and the
#     mock server has no TLS mode, which is where #1143 records it.
#   - What an installer costs to run (NSIS, dmg, AppImage's FUSE mount). The
#     app is packaged unpacked (`--dir`) and launched from there: the same
#     asar, the same resources/bin engine and the same main process a user
#     installs, without three installer formats on three runners (#1165).

on:
  schedule:
    # Weekly, Monday. 14:00 UTC keeps clear of the other crons competing for the
    # runner pool: cache-warm and codeql at 06:00, sanitizers 09:00, tidy 11:00.
    - cron: '0 14 * * 1'
  workflow_dispatch:
  # A measurement workflow has no business running on ordinary PRs, and this
  # trigger does not: it is scoped to this workflow's own machinery. Without it
  # the first evidence that any of this works arrives after merge, on a cron, as
  # a red master - a workflow cannot be dispatched before it exists on the
  # default branch. Same pattern, same reason, as sanitizers.yml and
  # engine-tidy-scan.yml.
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/perf-measure.yml'
      - 'scripts/perf/**'

concurrency:
  group: perf-measure-${{ github.ref }}
  # A cron or dispatch run is data and is never thrown away half-taken
  # (cache-warm.yml makes the same call). A pull_request run is only proving
  # this machinery still works, and only the newest commit's answer counts -
  # left uncancelled, every push during a fix cycle stacks another three-OS
  # engine build alongside the ones already running.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  measure:
    name: Measure on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The engine build dominates: pr-tests.yml budgets 90 for build + ctest, and
    # this trades ctest for ~6 min of sampling. A runaway guard, not a budget.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            preset: linux-prod
            engine: engine/build-release/vayu-engine
            mock: ./mock-server
            # The platform is named because `electron-builder.json` declares
            # installer targets - the mac ones universal, which needs two engine
            # arches this job does not build. The architecture is deliberately
            # not named: electron-builder defaults to the runner's own, which is
            # the arch of the engine binary staged inside it, and naming one
            # would silently produce an app that cannot run the day an image
            # changes architecture.
            pack: --linux dir
          - os: windows-latest
            preset: windows-prod
            engine: engine/build-release/vayu-engine.exe
            mock: ./mock-server.exe
            pack: --win dir
          - os: macos-latest
            preset: macos-prod
            engine: engine/build-release/vayu-engine
            mock: ./mock-server
            pack: --mac dir
    env:
      VCPKG_COMMIT: '114d9fe62faf35856b45cf55cb93b57028a45d63'
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-archives,readwrite'
      SCCACHE_GHA_ENABLED: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            build-essential \
            pkg-config \
            ca-certificates \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            xvfb \
            openbox \
            x11-utils

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v ninja || brew install ninja
          for pkg in autoconf autoconf-archive automake libtool; do
            brew list --formula "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: Cache vcpkg compiled packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('engine/vcpkg.json') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('engine/vcpkg.json') }}-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'
          vcpkgJsonGlob: 'engine/vcpkg.json'

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure sccache compiler launcher
        shell: bash
        run: |
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"

      # The production preset, not dev. A debug engine's CPU figures are
      # inflated - the caveat the sweep had to carry, and the reason this exists.
      - name: Build engine (production preset)
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/engine/CMakeLists.txt'
          configurePreset: ${{ matrix.preset }}
          buildPreset: ${{ matrix.preset }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Both halves, now that the packaged app is launched: `main` in
      # app/package.json points at dist-electron/main.js, which is what
      # electron:compile emits. Until #1165 only the renderer was built, because
      # the startup harness loads dist/ into a window of its own and never
      # touches the main process.
      - name: Build the renderer and compile the main process
        working-directory: app
        run: |
          pnpm run build
          pnpm run electron:compile

      # Where a production build looks for the engine: electron-builder copies
      # `app/build/resources/bin` into the package's `resources/bin`, and
      # `sidecar.ts` resolves `process.resourcesPath/bin` there when NODE_ENV is
      # unset. Without this the packaged app throws a plain Error on the missing
      # binary, which `startEngine`'s catch turns into a modal box and a quit -
      # no window, and the cold-start leg reports a launch that never showed one.
      - name: Stage the engine into the app's resources
        shell: bash
        run: |
          mkdir -p app/build/resources/bin
          cp "${{ matrix.engine }}" app/build/resources/bin/
          chmod +x app/build/resources/bin/*
          ls -l app/build/resources/bin

      # All three platform blocks in `electron-builder.json` name an icon, but a
      # `dir` build only reads the two single-file ones: the .app's icon and the
      # .exe's are written during the pack itself. Linux's `build/icons` is an
      # icon *set* that only the AppImage and deb targets read for their desktop
      # entry, so an unpacked Linux build packages without it - measured, not
      # assumed. release.yml stages all of them, and the license text with them,
      # because an installer ships what this measurement never builds.
      - name: Stage the icons a dir build reads
        if: runner.os != 'Linux'
        shell: bash
        run: |
          mkdir -p app/build
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp shared/icon_png/vayu_icon_512x512.png app/build/icon.png
          else
            cp shared/icon_ico/vayu_icon_256x256.ico app/build/icon.ico
          fi

      # `dir`, not the installers release.yml builds: an unpacked build is the
      # same asar, the same staged engine and the same main process, and it is
      # what the cold-start leg launches. Paying three runners to also compress
      # a dmg, an NSIS installer and an AppImage would measure the packaging,
      # not the app.
      - name: Package the app, unpacked
        working-directory: app
        run: pnpm exec electron-builder --config electron-builder.json ${{ matrix.pack }} --publish never

      # A package without the engine still launches, and that is the problem:
      # `startEngine` catches the missing binary and calls `dialog.showErrorBox`,
      # which blocks the main process on a modal nobody can dismiss on a runner,
      # so `ready-to-show` never fires and the leg reports a 90-second timeout
      # with no cause in it. Named here instead, before anything is measured.
      - name: Check the packaged app carries the engine
        shell: bash
        run: |
          # -ipath, because the directory extraResources lands in is named for
          # the platform's own convention: `resources/bin` in an unpacked Linux
          # or Windows build, `Vayu.app/Contents/Resources/bin` on macOS.
          staged="$(find app/release -type f -ipath '*/resources/bin/vayu-engine*' | head -n 1)"
          if [ -z "$staged" ]; then
            echo "::error::the packaged build has no engine under resources/bin - electron-builder's extraResources did not copy app/build/resources/bin"
            find app/release -maxdepth 3 -name resources -type d
            exit 1
          fi
          ls -l "$staged"

      # Not left to the runner image: the first run of this workflow died here
      # with `go: command not found` on macos-latest. Go is documented as
      # preinstalled on all three images and is not actually on PATH for every
      # one of them, and the mock server is the load phase's target - without it
      # there is no measurement at all. `stable` rather than a pin because
      # mock-server.go is plain net/http with no go.mod and no version floor.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Build the mock server
        shell: bash
        run: |
          go version
          go build -o "${{ matrix.mock }}" scripts/test/mock-server.go

      - name: Measure the engine
        shell: bash
        run: |
          python scripts/perf/measure_engine.py \
            --engine "${{ matrix.engine }}" \
            --mock "${{ matrix.mock }}" \
            --data-dir "$RUNNER_TEMP/perf-data" \
            --log-dir perf-logs \
            --out perf-engine.json

      # Electron ships its SUID sandbox helper without the ownership it needs,
      # and npm cannot set it - so on the Linux runner every launch aborts with
      # "The SUID sandbox helper binary was found, but is not configured
      # correctly", which cost this workflow its Linux startup figure on the
      # first green run. This is the remedy that error itself prescribes, and
      # it keeps the sandbox: --no-sandbox would also work and would be turning
      # off a security boundary to make a measurement convenient.
      #
      # Two copies of the helper, because two things launch Electron here: the
      # harness runs the one under node_modules, and the cold-start leg runs the
      # packaged build's own. One remedy, applied to both - the fix is identical
      # and a second copy of it is a second place to forget.
      - name: Configure Electron's sandbox helpers (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # tail -n 1 because requiring electron can print "Downloading Electron
          # binary..." to stdout ahead of the path, and the whole two-line
          # capture then gets handed to chown as one filename.
          bundled="$(dirname "$(cd app && node -p "require('electron')" | tail -n 1)")/chrome-sandbox"
          # The glob rather than `linux-unpacked` outright: electron-builder
          # names the directory for the arch it built, and this job names none.
          for sandbox in "$bundled" app/release/linux*-unpacked/chrome-sandbox; do
            if [ ! -f "$sandbox" ]; then
              echo "::warning::no chrome-sandbox at $sandbox - the leg that launches it will report unavailable"
              continue
            fi
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
            ls -l "$sandbox"
          done

      # The Windows and macOS runners have a desktop session and launch the app
      # directly. The Linux runner has no display at all, so Xvfb supplies one -
      # and, since #1165, a window manager on top of it. A bare X server maps
      # and focuses nothing: measured on this workflow's own runner, the
      # packaged app came up whole - engine listening, MCP up, the renderer
      # fetching from it - and never produced a frame, so `ready-to-show` never
      # fired and the leg reported a 90-second timeout. The harness's plain
      # window became showable in the same session, which is what makes this a
      # property of the app's window rather than of Electron here.
      - name: Measure the app
        shell: bash
        run: |
          measure="node scripts/perf/measure-app.mjs --out perf-app.json --packaged-dir app/release"
          if [ "${{ runner.os }}" != "Linux" ]; then
            $measure
            exit
          fi
          # openbox inside the session, not beside it: the display only exists
          # for the length of xvfb-run's command, and it exits with it. Waited
          # for rather than merely started - a backgrounded window manager takes
          # a moment to claim the role, and the app launches about a second
          # later: one run measured 743 ms and the next timed out with the same
          # workflow, which is the shape of that race. `_NET_SUPPORTING_WM_CHECK`
          # is the property a manager sets when it has taken over.
          xvfb-run -a bash -c '
            openbox --sm-disable &
            for _ in $(seq 50); do
              xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q "window id" && break
              sleep 0.2
            done
            if ! xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q "window id"; then
              echo "::warning::no window manager after 10s - the packaged leg will report unavailable"
            fi
            '"$measure"

      # tee, not a plain redirect: a leg that reports "unavailable" is a green
      # job with a note in it, so the log has to carry the table too. That is
      # where anyone looks when a run measured nothing, and a step summary is
      # not readable from the API a checkout or a review tool has.
      - name: Summarize
        if: always()
        shell: bash
        run: |
          python scripts/perf/summarize.py \
            --os "${{ matrix.os }}" \
            --engine-json perf-engine.json \
            --app-json perf-app.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-measure-${{ matrix.os }}
          path: |
            perf-engine.json
            perf-app.json
            perf-logs/
          # The child logs are why perf-logs/ is here: when a leg fails, the
          # engine's own stdout is the only diagnostic the runner keeps.
          if-no-files-found: error
          retention-days: 90
