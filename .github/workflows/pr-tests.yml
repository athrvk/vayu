name: PR CI - run tests

# No `paths-ignore` here on purpose. `CI gate` below is a required check, and a
# workflow that never starts never reports one - GitHub leaves the check
# "Expected" forever and the pull request can only be merged by an admin
# bypassing the rule. A docs-only change would be blocked outright.
#
# The filtering happens at the job level instead: `changes` always runs, the
# work jobs are skipped when nothing they own was touched, and `ci-gate` still
# reports. That is the case its "or skipped" branch was always written for.
#
# The work is split by tree - `app`, `engine`, `installer`, `build-script` -
# rather than run as one job per OS, because the trees have wildly different
# costs and are
# rarely touched together. Measured over the last 28 runs (median 14.0 min, p90
# 16.6 min), with warm vcpkg and sccache caches:
#
#                                  ubuntu    macos   windows
#   engine (vcpkg -> build -> ctest)  5m20     9m10     11m00
#   app (install -> tsc -> vitest)    2m10     2m30      3m40
#
# The engine was 68-73% of every job and the app steps ran *after* it in the
# same job, so on an app-only pull request the type-check first executed almost
# twelve minutes in. Over the last 200 non-merge commits, 63 were app-only, 20
# engine-only and 20 touched both - so nearly half of all code changes were
# paying for a full three-platform C++ build that could not be affected by the
# diff. Split, an app-only pull request reports in roughly four minutes and an
# engine-only one stops paying for three Node installs.
#
# The same argument, applied a second time to what was left (#805 phase 3). The
# app job had grown back to 9m03s-9m12s on Windows against 6m03s-6m50s
# elsewhere, and the shape was the same one: work that could not fail
# differently sitting in front of, or beside, the work that could.
#
#   app windows  9m03s   one unsharded vitest run, 7m35s-7m58s of it
#   app ubuntu   6m03s   lint 39s + format 13s + type-check 22s, then vitest
#
# So the platform-independent checks moved out to `quality`, which runs beside
# the suites rather than ahead of one of them, and the Windows leg is two
# vitest shards on two runners. Both are wall-clock changes only - the same
# checks run on the same code, and `ci-gate` proves the shards between them ran
# every file the suite contains.
on:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Both filters read the PR's file list from the API rather than cloning, so
    # this is all they need. Stated explicitly rather than inherited, since a
    # fork PR's token is read-only regardless and this job must work for those.
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.code.outputs.code }}
      app: ${{ steps.area.outputs.app }}
      engine: ${{ steps.area.outputs.engine }}
      installer: ${{ steps.area.outputs.installer }}
      build_script: ${{ steps.area.outputs.build_script }}
    steps:
      # Two invocations, because `predicate-quantifier` applies to the whole
      # action and the two kinds of filter need opposite ones. This one answers
      # "is there anything here a build could care about at all", which is only
      # expressible as `**` minus a list; the area filters below are plain
      # unions and need the default. Both are API calls, so the second costs no
      # runner time.
      - name: Check whether anything outside docs changed
        uses: dorny/paths-filter@v4
        id: code
        with:
          # `every`, not the default `some`. The default means "include the file
          # if it matches at least one pattern" - and `**` matches everything,
          # so every file short-circuits on the first line and the `!` patterns
          # below never subtract anything. The filter could not return false,
          # which the first run showed plainly: it listed CONTRIBUTING.md as a
          # matching file. `every` requires all patterns to hold, so `**` admits
          # the file and each exclusion can then reject it.
          predicate-quantifier: every
          # Same list the trigger used to carry. Both `*.md` and `**/*.md` are
          # present because the first covers root-level files like README.md and
          # the second covers nested ones.
          # The docs-site build machinery is excluded for the same reason
          # `docs/**` is: none of it can affect the engine or the app. It is
          # enumerated rather than covered by a `!.github/**` blanket, because a
          # change to *this* workflow, or to codeql/labeler/release, must still
          # run the matrix. Each of these is checked by the `Docs site` workflow
          # instead, which runs `mkdocs build --strict` on the same paths.
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!**/*.md'
              - '!LICENSE'
              - '!.gitignore'
              - '!scripts/install-git-hooks.sh'
              - '!.github/mkdocs.yml'
              - '!.github/hooks/**'
              - '!.github/workflows/docs.yml'
              - '!requirements-docs.txt'

      # Default quantifier (`some`) on purpose: each filter below is a union of
      # paths, so "matched at least one" is the question being asked. These are
      # deliberately *not* responsible for excluding documentation - a change to
      # app/src/modules/README.md matches `app/**` here and is rejected by
      # `code` above instead, so the docs rule stays written down once.
      - name: Route to the trees the change can affect
        uses: dorny/paths-filter@v4
        id: area
        with:
          # `shared/**` belongs to the app: vitest and vite both alias it to
          # `@shared`, so an icon or asset there is compiled into the renderer.
          # `build.py` and `VERSION` are listed under both trees because either
          # can change how either side builds, and a version bump touches both
          # anyway. This workflow is listed everywhere so that a change to the
          # split itself is exercised by every job it describes.
          #
          # A change can be `code` and still match no area, and that is a pass,
          # not a hole. Replaying the last 120 non-merge commits through these
          # globs, every such commit was repository metadata - .github/labeler.yml,
          # codeql.yml, dependabot.yml, CODEOWNERS, .github/scripts/ - none of
          # which can alter a build artifact, and each of which has its own
          # workflow where it applies. They used to run the full three-platform
          # matrix and prove nothing. If you add something under `.github/` that
          # *is* load-bearing for a build, give it an area here.
          filters: |
            app:
              - 'app/**'
              - 'shared/**'
              - 'build.py'
              - 'VERSION'
              - '.github/workflows/pr-tests.yml'
            engine:
              - 'engine/**'
              - 'build.py'
              - 'VERSION'
              - '.github/check-windows-deps.py'
              - '.github/workflows/pr-tests.yml'
            build_script:
              - 'build.py'
              - 'scripts/test/vcpkg_baseline_test.py'
              - '.github/workflows/pr-tests.yml'
            installer:
              - 'install.sh'
              - 'scripts/test/install_test.sh'
              - 'scripts/test/install_e2e.sh'
              # The git hook rides this job because it is the only one with a
              # shell toolchain (shellcheck, bash) already stood up.
              - 'scripts/pre-commit'
              - 'scripts/test/pre-commit_test.sh'
              - '.github/workflows/pr-tests.yml'

  # Lint, formatting and type-check are platform-independent, so one runner
  # answers for all three - they used to run inside the app job, where roughly
  # 1.2 min of them stood in front of the suite that is the job's whole point,
  # and the type-check ran a second and third time on runners that could not
  # answer differently. Out here they run beside the tests instead of ahead of
  # them (#805 phase 3).
  #
  # Nothing platform-specific is lost. `forceConsistentCasingInFileNames` makes
  # the casing question a *Linux* question, and tsc has no other per-platform
  # verdict; the matrix below exists for what the suite asserts at runtime, not
  # for what the compiler says about the same files three times.
  quality:
    name: App quality checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.app == 'true'
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: app
        run: pnpm lint

      - name: Check frontend formatting
        working-directory: app
        run: pnpm format:check

      # Three tsc projects, run concurrently by the script itself. A failing
      # project still fails the script - `concurrently` defaults to
      # `--success all` - and unlike the `&&` chain it replaced, all three now
      # report their errors in one run instead of stopping at the first.
      - name: Type-check frontend
        working-directory: app
        run: pnpm type-check

  app:
    name: App on ${{ matrix.os }}${{ matrix.shard && format(' (shard {0})', matrix.shard) || '' }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.app == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # All three platforms, even though nothing here compiles. The suite
        # asserts platform behaviour (`platform.test.ts`, `updater.test.ts`) and
        # the macOS runner is the only one that has ever caught a regression in
        # the macOS branch - see the testing section of CLAUDE.md.
        #
        # Windows is split in two because it is the wall of every app-only pull
        # request: one unsharded run measured 7m35s-7m58s there against ~5 min
        # on the other two, for a 9m03s-9m12s job. The suite is already parallel
        # within a run (`pool: threads`, no worker cap) - the second runner buys
        # what more threads on one runner cannot. ubuntu and macOS stay
        # unsharded: they are not the wall, and a second runner each would cost
        # more than it saves.
        #
        # `shard` is the literal vitest argument, so the index and the count
        # cannot drift apart. Adding a third shard means adding `3/3` here *and*
        # renumbering the others - the coverage check in `ci-gate` fails loudly
        # if that is done by halves.
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
            shard: 1/2
          - os: windows-latest
            shard: 2/2
    # Roughly 4 minutes on the slowest runner; the ceiling is for a cold pnpm
    # store, not for the steady state.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # One step rather than two `if`-guarded ones, so the unsharded and sharded
      # invocations cannot drift. The json report is written only where it is
      # read - by the manifest step below.
      - name: Run frontend tests
        working-directory: app
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [[ -z "$SHARD" ]]; then
            pnpm test
          else
            pnpm test --shard="$SHARD" --reporter=default --reporter=json --outputFile.json=vitest-shard.json
          fi

      # A sharded suite is green when each shard is green, which is also true of
      # a shard that ran nothing at all. These two files are what makes the
      # difference visible: what this shard ran, and what the suite contains.
      # `ci-gate` unions them across the shards and compares.
      - name: Record what this shard ran
        if: matrix.shard
        id: manifest
        working-directory: app
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          index="${SHARD%%/*}"
          node scripts/shard-manifest.mjs vitest-shard.json > "shard-${index}.txt"
          pnpm exec vitest list --filesOnly | node scripts/shard-manifest.mjs - > "full-suite-${index}.txt"
          ran=$(wc -l < "shard-${index}.txt")
          total=$(wc -l < "full-suite-${index}.txt")

          # The manifest script already refuses an empty shard. This is the
          # other half: a shard that ran *everything* means `--shard` was
          # accepted and ignored, which reads as a pass while costing twice the
          # runner time it was meant to save.
          if [[ "$ran" -ge "$total" ]]; then
            echo "::error::Shard $SHARD ran $ran of $total files - the shard argument did not take effect"
            exit 1
          fi

          echo "artifact=vitest-shard-manifest-${index}" >> "$GITHUB_OUTPUT"
          echo "- shard \`$SHARD\` ran **$ran** of **$total** test files" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload this shard's manifest
        if: matrix.shard
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.manifest.outputs.artifact }}
          path: |
            app/shard-*.txt
            app/full-suite-*.txt
          if-no-files-found: error
          retention-days: 1

  engine:
    name: Engine on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.engine == 'true'
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # VAYU_WERROR turns the GCC/Clang warning set into build errors, on
          # both legs that use it (issue #884) - a warning that only one
          # compiler emits is exactly the kind this gate exists to catch, so
          # gating Linux alone would leave Clang-only diagnostics unwatched.
          # Windows needs no flag: MSVC builds /WX unconditionally.
          - os: ubuntu-latest
            preset: linux-prod
            configureArgs: "['-DVAYU_BUILD_TESTS=ON', '-DVAYU_WERROR=ON']"
          - os: windows-latest
            preset: windows-prod
            configureArgs: "['-DVAYU_BUILD_TESTS=ON']"
          - os: macos-latest
            preset: macos-prod
            configureArgs: "['-DVAYU_BUILD_TESTS=ON', '-DVAYU_WERROR=ON']"
    timeout-minutes: 60
    env:
      VCPKG_COMMIT: '94a541197763a4f449a1b91478df48c0584a6256'
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-archives,readwrite'
      SCCACHE_GHA_ENABLED: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            build-essential \
            pkg-config \
            ca-certificates \
            autoconf \
            autoconf-archive \
            automake \
            libtool

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        # autoconf-archive and friends are for vcpkg's libsodium, which builds
        # from source through its autotools path and runs autoreconf first.
        # brew's libtool provides glibtoolize, which vcpkg accepts in place of
        # libtoolize.
        run: |
          command -v ninja || brew install ninja
          for pkg in autoconf autoconf-archive automake libtool; do
            brew list --formula "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: Cache vcpkg compiled packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('engine/vcpkg.json') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('engine/vcpkg.json') }}-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'
          vcpkgJsonGlob: 'engine/vcpkg.json'

      # sccache used to be skipped on Windows. sccache-action@v0.0.10 failed its
      # install step on the Windows Server 2025 + Visual Studio 2026 image
      # GitHub rolled across windows-latest in June 2026: "Unable to locate
      # executable file: undefined" in the post-step, which took every
      # downstream build and test step with it.
      #
      # v0.0.11 bumps @actions/io from 2.x to 3.x, and `which()` in that package
      # is what raises exactly that error, so the skip is lifted here to find
      # out whether it is fixed. Windows was the one runner that had never
      # exercised this action, and a skip cannot tell you it is still needed.
      # If the engine job goes red on windows-latest, put
      # `if: runner.os != 'Windows'` back on both steps; the build is slower
      # without sccache but reliable.
      #
      # The launcher is safe on MSVC here because windows-prod is a Release
      # build - CMake passes no /Zi, so there is no separate PDB for sccache to
      # choke on. Check that again before enabling it for windows-dev (Debug).
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure sccache compiler launcher
        shell: bash
        run: |
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"

      - name: Build engine
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/engine/CMakeLists.txt'
          configurePreset: ${{ matrix.preset }}
          buildPreset: ${{ matrix.preset }}
          configurePresetAdditionalArgs: "${{ matrix.configureArgs }}"

      # The engine must depend on nothing outside Windows itself. ctest below
      # runs on a runner that already has the Visual C++ redistributable, so it
      # cannot tell a self-contained binary from one that only works here -
      # which is exactly how v0.10.0 and v0.11.0 shipped an engine that could
      # not start on a clean machine. This inspects the import table instead.
      - name: Verify engine has no non-Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --quiet pefile
          python .github/check-windows-deps.py engine/build-release/vayu-engine.exe

      # `< /dev/null` is what a shell step already gives ctest here, written
      # down so it stays true: release.yml pins the same redirect on its own
      # ctest steps, and the pair is the contract that the suite sees one stdin
      # in both places. Without it the release path ran ctest under
      # `lukka/run-cmake`, whose child gets an unwritten pipe - which is how the
      # v0.16.0 stdin failure passed every pull request and failed on the tag.
      # See #589; drop the redirect on one side and that class is reachable
      # again.
      - name: Run engine tests
        working-directory: engine
        shell: bash
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --output-junit "$GITHUB_WORKSPACE/engine/test-results.xml" < /dev/null

      # `always()` so a suite that ran and failed is still reported - but on its
      # own that also reports a *pass* for a job that never got as far as
      # running a test. When `Build engine` fails or the job is cancelled,
      # `Run engine tests` is skipped, no report file is written, and the action
      # defaults to publishing a green `C++ Tests ()` check over nothing at all
      # (seen on runs 31379169990 and 31378525863, where the Windows engine had
      # not compiled). `require_tests` is what closes that: a missing report
      # fails this step instead of inventing a pass, and the action returns
      # before creating any check run. The legitimate no-report case - a
      # docs-only change - never reaches here, because `changes.outputs.code`
      # skips the whole job.
      #
      # `fail_on_failure` stays off deliberately, so the pair is a decision and
      # not a default: `Run engine tests` above already fails the job on a red
      # suite, and turning this on would make one failing test fail two steps.
      - name: Publish C++ test results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'engine/test-results.xml'
          check_name: 'C++ Tests (${{ matrix.os }})'
          require_tests: true
          fail_on_failure: false

  installer:
    name: Installer script on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.installer == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # macOS as well as Linux because install.sh is the macOS installer and
        # its dry-run test exercises the real `codesign`/`xattr` call sites.
        # Windows is absent for the same reason it was absent before the split:
        # there is no shell to run it in.
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Pinned, and the same build on both runners. Ubuntu's apt and Homebrew
      # ship different versions, and shellcheck's findings differ between them:
      # a file clean under one has twice failed here on a rule the other does
      # not emit, and once the *same* finding arrived under a different code
      # (SC2317 in 0.9/0.10, SC2329 in 0.11). Pinning makes a local run mean
      # something, and moves a version bump into a commit someone chose to make.
      - name: Install shellcheck
        shell: bash
        env:
          SHELLCHECK_VERSION: v0.10.0
        run: |
          case "${RUNNER_OS}-$(uname -m)" in
            Linux-x86_64)   target=linux.x86_64 ;;
            Linux-aarch64)  target=linux.aarch64 ;;
            macOS-arm64)    target=darwin.aarch64 ;;
            macOS-x86_64)   target=darwin.x86_64 ;;
            *) echo "::error::No pinned shellcheck build for ${RUNNER_OS}-$(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.${target}.tar.xz"
          curl -fsSL "$url" | tar -xJ
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Lint and test installer script
        shell: bash
        run: |
          shellcheck install.sh scripts/test/install_test.sh scripts/test/install_e2e.sh
          bash scripts/test/install_test.sh

      # The pre-commit hook's clang-tidy version probe (#659). Linux only: the
      # hook prepends Homebrew's LLVM directory when it exists, which shadows
      # the stubbed clang-tidy the suite drives it with, and the probe has no
      # platform-specific half worth running twice.
      - name: Lint and test the pre-commit hook
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shellcheck scripts/pre-commit scripts/test/pre-commit_test.sh
          bash scripts/test/pre-commit_test.sh

      # The dry-run suite above asserts on the commands the installer would have
      # run. This one runs it: a real download from a local release, a real
      # extraction, placement, update and uninstall, into a temporary root. It
      # is the only thing here that exercises ditto, codesign and the swap on
      # macOS, or a genuine mv-into-place on Linux - and both bugs that made the
      # Linux path unusable were invisible to a dry run.
      - name: End-to-end install, update and uninstall
        shell: bash
        run: bash scripts/test/install_e2e.sh

      # `bash` on the macOS runner is Homebrew's 5.x, but a stock Mac has only
      # /bin/bash 3.2.57 - and the documented command resolves `bash` from PATH,
      # so that is what most users actually run this under. Nothing in the
      # script needs bash 4, and this is what keeps it that way: a `mapfile`, an
      # associative array or a `${var,,}` would pass every other job and fail on
      # every Mac.
      - name: Test installer under macOS's own bash 3.2
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -1
          /bin/bash scripts/test/install_test.sh
          /bin/bash scripts/test/install_e2e.sh

  # build.py's plumbing, on its own job because it needs neither a C++ toolchain
  # nor Node: throwaway git repositories and python3. Linux only - the code under
  # test shells out to git, which behaves the same on every runner, and the
  # engine job already covers build.py's real use on all three.
  build-script:
    name: Build script
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.build_script == 'true'
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Test the stale-vcpkg-baseline self-heal
        run: python3 scripts/test/vcpkg_baseline_test.py

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    # `changes` is a dependency as well as the work jobs, so a failure in the
    # filter cannot be read as "nothing to test". Without it, a broken `changes`
    # job skips everything, and "skipped" would pass this gate on a change
    # nobody ran.
    needs: [changes, quality, app, engine, installer, build-script]
    if: always()
    # `actions: read` is what lets the download below reach this run's own
    # artifacts; everything else here reads job results, which need nothing.
    permissions:
      contents: read
      actions: read
    steps:
      # The shard coverage proof lives here rather than in a job of its own
      # because this is the only job that already runs after both Windows
      # shards, and two file downloads add seconds to it instead of a runner
      # start to the wall clock. It runs before the result check below so that a
      # suite which was half-run is reported as such even on a run where every
      # job is green - which is exactly the shape of the failure it guards.
      - name: Collect the app shard manifests
        if: needs.app.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-shard-manifest-*
          merge-multiple: true
          path: shard-manifests

      - name: Prove the shards ran the whole suite between them
        if: needs.app.result == 'success'
        shell: bash
        run: |
          shopt -s nullglob
          manifests=(shard-manifests/shard-*.txt)
          suites=(shard-manifests/full-suite-*.txt)

          # One manifest per sharded leg. A count that is not 2 means the matrix
          # gained or lost a shard without this number following it - the case
          # where `1/2` and `2/3` coexist and a third of the suite runs nowhere.
          if [[ ${#manifests[@]} -ne 2 || ${#suites[@]} -ne 2 ]]; then
            echo "::error::Expected 2 shard manifests, found ${#manifests[@]}"
            exit 1
          fi

          # Both shards enumerate the suite from the same commit, so a
          # disagreement means one of them was looking at a different tree and
          # the comparison below would prove nothing.
          if ! diff -u "${suites[0]}" "${suites[1]}"; then
            echo "::error::The shards disagree about which test files exist"
            exit 1
          fi

          duplicated=$(sort "${manifests[@]}" | uniq -d)
          if [[ -n "$duplicated" ]]; then
            echo "::error::Shards overlap - these files ran twice:"
            echo "$duplicated"
            exit 1
          fi

          sort -u "${manifests[@]}" > union.txt
          if ! diff -u union.txt "${suites[0]}"; then
            echo "::error::The shards did not run every test file (- ran, + expected)"
            exit 1
          fi

          echo "- Windows shards covered all **$(wc -l < union.txt)** test files, none twice" >> "$GITHUB_STEP_SUMMARY"

      - name: Pass if every job succeeded or was skipped
        run: |
          changes="${{ needs.changes.result }}"
          if [[ "$changes" != "success" ]]; then
            echo "CI failed (change detection: $changes)"
            exit 1
          fi

          # Each work job is skipped when its tree was untouched, which is the
          # whole point of the split - so "skipped" passes here exactly as it
          # did when there was a single `test` job. Anything else (failure,
          # cancelled) fails the gate.
          status=0
          check() {
            if [[ "$2" == "success" || "$2" == "skipped" ]]; then
              echo "  $1: $2"
            else
              echo "  $1: $2  <-- failed"
              status=1
            fi
          }
          check quality   "${{ needs.quality.result }}"
          check app       "${{ needs.app.result }}"
          check engine    "${{ needs.engine.result }}"
          check installer "${{ needs.installer.result }}"
          check build-script "${{ needs['build-script'].result }}"

          if [[ $status -ne 0 ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
