name: PR CI - run tests

# No `paths-ignore` here on purpose. `CI gate` below is a required check, and a
# workflow that never starts never reports one - GitHub leaves the check
# "Expected" forever and the pull request can only be merged by an admin
# bypassing the rule. A docs-only change would be blocked outright.
#
# The filtering happens at the job level instead: `changes` always runs, the
# work jobs are skipped when nothing they own was touched, and `ci-gate` still
# reports. That is the case its "or skipped" branch was always written for.
#
# The work is split by tree - `app`, `engine`, `installer`, `build-script` -
# rather than run as one job per OS, because the trees have wildly different
# costs and are
# rarely touched together. Measured over the last 28 runs (median 14.0 min, p90
# 16.6 min), with warm vcpkg and sccache caches:
#
#                                  ubuntu    macos   windows
#   engine (vcpkg -> build -> ctest)  5m20     9m10     11m00
#   app (install -> tsc -> vitest)    2m10     2m30      3m40
#
# The engine was 68-73% of every job and the app steps ran *after* it in the
# same job, so on an app-only pull request the type-check first executed almost
# twelve minutes in. Over the last 200 non-merge commits, 63 were app-only, 20
# engine-only and 20 touched both - so nearly half of all code changes were
# paying for a full three-platform C++ build that could not be affected by the
# diff. Split, an app-only pull request reports in roughly four minutes and an
# engine-only one stops paying for three Node installs.
#
# The same argument, applied a second time to what was left (#805 phase 3). The
# app job had grown back to 9m03s-9m12s on Windows against 6m03s-6m50s
# elsewhere, and the shape was the same one: work that could not fail
# differently sitting in front of, or beside, the work that could.
#
#   app windows  9m03s   one unsharded vitest run, 7m35s-7m58s of it
#   app ubuntu   6m03s   lint 39s + format 13s + type-check 22s, then vitest
#
# So the platform-independent checks moved out to `quality`, which runs beside
# the suites rather than ahead of one of them, and the Windows leg is two
# vitest shards on two runners. Both are wall-clock changes only - the same
# checks run on the same code, and `ci-gate` proves the shards between them ran
# every file the suite contains.
on:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Both filters read the PR's file list from the API rather than cloning, so
    # this is all they need. Stated explicitly rather than inherited, since a
    # fork PR's token is read-only regardless and this job must work for those.
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.code.outputs.code }}
      app: ${{ steps.area.outputs.app }}
      app_doc_fixtures: ${{ steps.area.outputs.app_doc_fixtures }}
      app_engine_inputs: ${{ steps.area.outputs.app_engine_inputs }}
      app_root_inputs: ${{ steps.area.outputs.app_root_inputs }}
      engine: ${{ steps.area.outputs.engine }}
      installer: ${{ steps.area.outputs.installer }}
      build_script: ${{ steps.area.outputs.build_script }}
      scripts: ${{ steps.area.outputs.scripts }}
    steps:
      # Two invocations, because `predicate-quantifier` applies to the whole
      # action and the two kinds of filter need opposite ones. This one answers
      # "is there anything here a build could care about at all", which is only
      # expressible as `**` minus a list; the area filters below are plain
      # unions and need the default. Both are API calls, so the second costs no
      # runner time.
      - name: Check whether anything outside docs changed
        uses: dorny/paths-filter@v4
        id: code
        with:
          # `every`, not the default `some`. The default means "include the file
          # if it matches at least one pattern" - and `**` matches everything,
          # so every file short-circuits on the first line and the `!` patterns
          # below never subtract anything. The filter could not return false,
          # which the first run showed plainly: it listed CONTRIBUTING.md as a
          # matching file. `every` requires all patterns to hold, so `**` admits
          # the file and each exclusion can then reject it.
          predicate-quantifier: every
          # Same list the trigger used to carry. Both `*.md` and `**/*.md` are
          # present because the first covers root-level files like README.md and
          # the second covers nested ones.
          # The docs-site build machinery is excluded for the same reason
          # `docs/**` is: none of it can affect the engine or the app. It is
          # enumerated rather than covered by a `!.github/**` blanket, because a
          # change to *this* workflow, or to codeql/labeler/release, must still
          # run the matrix. Each of these is checked by the `Docs site` workflow
          # instead, which runs `mkdocs build --strict` on the same paths.
          #
          # `.github/hooks/**` and `scripts/install-git-hooks.sh` used to be
          # excluded here too, on that same reasoning - neither can change a
          # build artifact. They are back in because #887 gave shell and Python
          # a linter and both are among the files it reads: a gate whose own
          # inputs cannot trigger it is the repository's "written but never
          # read" defect in wiring form. `code` admits them; the area filter
          # below routes them to `Script lint` alone, so the matrix they still
          # cannot affect still does not run.
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!**/*.md'
              - '!LICENSE'
              - '!.gitignore'
              - '!.github/mkdocs.yml'
              - '!.github/workflows/docs.yml'
              - '!requirements-docs.txt'

      # `some-with-excludes`: a file routes to an area if it matches at least
      # one of the paths listed - they are a union - and no `!` pattern rejects
      # it. Plain `some` cannot express the second half, because a lone `!`
      # pattern under it matches every file *outside* the tree and turns the
      # filter permanently true; `every` cannot express the first, because it
      # turns the union into an intersection no file can satisfy.
      #
      # These filters used to leave documentation entirely to `code` above, on
      # the reasoning that the docs rule should be written down once - a
      # README.md under app/ matched `app/**` here and `code` rejected it. That
      # is wrong whenever a pull request touches both, because the two filters
      # are evaluated over the *changeset*, not per file: `code` asks "is any
      # file here not documentation", the area asks "is any file here in this
      # tree", and the job condition ANDs two answers that different files gave.
      # A change to `engine/CLAUDE.md` plus any script therefore ran the engine
      # matrix on all three platforms with no engine source touched (seen on
      # #913, where the two answers came from `engine/CLAUDE.md` and
      # `scripts/pre-commit`). The docs rule is still written once per area
      # rather than once per repository, which is the smallest place it can live
      # and still be true.
      #
      # Only `app` and `engine` carry it, because only their unions contain a
      # tree glob that a `.md` can fall inside. The other three name individual
      # files or extension globs that no `.md` can match. Add a `**` glob to one
      # of them and it needs these two lines too.
      - name: Route to the trees the change can affect
        uses: dorny/paths-filter@v4
        id: area
        with:
          predicate-quantifier: some-with-excludes
          # `shared/**` belongs to the app: vitest and vite both alias it to
          # `@shared`, so an icon or asset there is compiled into the renderer.
          # `VERSION` is listed under both trees because a version bump touches
          # both. `build.py` deliberately is NOT: neither work job invokes it -
          # `app` is pnpm + vitest, `engine` is lukka/run-cmake on the presets
          # plus ctest - so routing a build.py edit there ran ~15 runner-minutes
          # of three-platform matrix that the change could not turn red. The
          # jobs that do exercise build.py are `build-script` (its plumbing
          # tests) and `Script lint` (ruff), and both already route on it. What
          # this costs is honest to name: build.py's *build path* - the cmake
          # invocations it composes - is exercised by no CI job on any routing,
          # only by every developer and release build, so a filter cannot buy
          # coverage of it. This workflow is listed everywhere so that a change
          # to the split itself is exercised by every job it describes.
          #
          # A change can be `code` and still match no area, and that is a pass,
          # not a hole. Replaying the last 120 non-merge commits through these
          # globs, every such commit was repository metadata - .github/labeler.yml,
          # codeql.yml, dependabot.yml, CODEOWNERS, .github/scripts/ - none of
          # which can alter a build artifact, and each of which has its own
          # workflow where it applies. They used to run the full three-platform
          # matrix and prove nothing. If you add something under `.github/` that
          # *is* load-bearing for a build, give it an area here.
          filters: |
            app:
              - 'app/**'
              - 'shared/**'
              - 'VERSION'
              - '.github/workflows/pr-tests.yml'
              # Both forms, for the reason the `code` filter gives above: the
              # bare one covers a root-level file, the `**/` one covers nested.
              - '!*.md'
              - '!**/*.md'
            # The pages under `docs/` that a suite in `app/` reads and asserts
            # against. They are prose, so `!**/*.md` above rejects them and
            # `code` rejects them twice over (`!docs/**` *and* `!**/*.md`) - and
            # they are also app test *input*, in the same sense
            # `engine/tests/fixtures/script-typedefs.d.ts` is, so editing one
            # can turn `pnpm test` red exactly the way a source file can. A gate
            # whose own inputs cannot trigger it is #887's defect again (#1118),
            # so they get their own union, ORed into the `app` job's condition
            # below. Not folded into `app` above: an exclusion in
            # `some-with-excludes` is final, so a positive rule listed after
            # `!**/*.md` is dead - it cannot include back what a `!` rejected.
            #
            # Four guards contribute, not the one #1118 routed: the typedefs
            # compile, plus the design-token, renderer-state and row-persistence
            # doc guards #1121 found in the same shape. One list rather than four
            # filters, because the job condition is the same OR for all of them
            # and a second filter would be a second thing to forget. The name
            # stays `app_doc_fixtures` - every page here is an app test fixture
            # that happens to be prose, which is as true of eight pages as of two.
            #
            # Only the pages a guard actually reads are listed. Routing `docs/**`
            # wholesale would be one line that cannot miss an input, and would
            # run the four-runner app matrix on every prose edit in the
            # repository - the cost `!**/*.md` exists to avoid.
            #
            # This list is not free-standing. `DOC_READING_GUARDS` in
            # `app/src/lib/routed-inputs.testkit.ts` names the same pages, and
            # `routes every path a guard reads, and no other`
            # (`app/src/lib/routed-inputs.test.ts`) compares this block against
            # the union of the four guards' lists - so adding a page to a guard
            # is red until it is routed here, and routing a page no guard reads
            # is red too.
            app_doc_fixtures:
              - 'docs/engine/scripting.md'
              - 'docs/app/pm-api-compatibility.md'
              - 'docs/design-system.md'
              - 'docs/app/state-management.md'
              - 'docs/app/architecture.md'
              - 'docs/app/api-integration.md'
              - 'docs/app/data-driven-runs.md'
              - 'docs/app/COMPONENTS.md'
            # The files under `engine/` that a suite in `app/` reads: engine
            # headers and sources a parity guard pins a value against, and the
            # fixtures a conformance guard replays. Same defect as the pages
            # above, by a different route (#1122) - these paths match `engine`
            # and nothing else, so an engine-only pull request ran the C++
            # matrix and skipped every app-side half of a conformance pair. The
            # engine side is not a substitute: ctest pins the fixture it
            # generates, and what no ctest can answer is whether the renderer
            # still agrees with the new value.
            #
            # `app_engine_fixtures` would have matched the name above, but half
            # of these are ordinary engine sources - `daemon.cpp` is nobody's
            # fixture - so the name says inputs.
            #
            # Narrow list rather than ORing the whole `engine` filter into the
            # job condition, decided on the last 100 merged pull requests
            # (2026-08-21 to 08-28 UTC, `git log --first-parent --merges`, each
            # merge's files replayed through the `app` and `engine` globs rather
            # than through "touched engine/" - a pull request that also bumps
            # `VERSION` is already an `app` pull request and pays regardless):
            #
            #   ran the engine matrix, skipped the app job   34 of 100
            #   ... of which touch a path listed here        21  (pay either way)
            #   ... of which touch no app test input         13  (the saving)
            #
            # The app matrix is four runners at a ~5m12s-6m10s median, so ~23
            # runner-minutes a pull request: routing the whole `engine` filter
            # would have added ~790 runner-minutes over that week against ~490
            # for this list. The saving is well under half because
            # `script-typedefs.d.ts` (10 of the 21) and `daemon.cpp` (8) are
            # touched by most engine work - but it is the same saving `!**/*.md`
            # buys above, and the list costs nothing to keep honest, because it
            # is compared against what the guards read (see below).
            #
            # This list is not free-standing either. `ENGINE_READING_GUARDS` in
            # `app/src/lib/routed-inputs.testkit.ts` names the same paths, and
            # the same comparison that holds the doc list to its guards holds
            # this one to its own - one table, two filters, so a third kind of
            # input costs an entry rather than a second copy of the assertions.
            app_engine_inputs:
              - 'engine/include/vayu/core/constants.hpp'
              - 'engine/src/daemon.cpp'
              - 'engine/src/http/routes/execution.cpp'
              - 'engine/src/db/database.cpp'
              - 'engine/include/vayu/types.hpp'
              - 'engine/include/vayu/http/curl_version_map.hpp'
              - 'engine/tests/fixtures/script-typedefs.d.ts'
              - 'engine/tests/fixtures/tree-order-conformance.json'
              - 'engine/tests/fixtures/recursive-run-order-conformance.json'
              - 'engine/tests/fixtures/variable-resolution-conformance.json'
              - 'engine/tests/fixtures/set-cookie-conformance.json'
              - 'engine/tests/fixtures/import-conformance.json'
            # The files at the repository root that a suite in `app/` reads.
            # Same defect again, by a third route (#1130): each of these holds
            # one half of a value the app cannot share a constant with - the
            # macOS update command lives in `README.md` and in `updater.ts`, the
            # Linux install layout in `install.sh` and in `appimage-stamp.ts` -
            # and the guard that holds the two halves together runs only in the
            # app job.
            #
            # Neither reaches it on its own. `README.md` is rejected by `!*.md`
            # in `app` and twice over by `code` (`!*.md` *and* `!**/*.md`), so a
            # README-only pull request runs **no job at all** and a reworded
            # macOS section lands green. `install.sh` matches `installer` and
            # `scripts`, never `app`, so an installer-only pull request runs the
            # installer suite and shellcheck and skips the one guard that holds
            # the Electron side to the shell's layout.
            #
            # Naming what this costs, as the block above does: a README-only
            # pull request now runs the four-runner app matrix (~23 runner-
            # minutes) where it previously ran nothing. That is the deliberate
            # trade - the alternative is a guard that cannot fire on its own
            # input - and it is bounded by how rare those pull requests are and
            # by the list being two literal paths rather than a glob.
            #
            # Not free-standing either. `ROOT_READING_GUARDS` in
            # `app/src/lib/routed-inputs.testkit.ts` names the same two files,
            # and the table that holds the two lists above to their guards holds
            # this one to its own - which is what #1122's generalisation bought:
            # a third kind of input costs an entry, not a third copy of the
            # assertions.
            app_root_inputs:
              - 'README.md'
              - 'install.sh'
            engine:
              - 'engine/**'
              - 'VERSION'
              - '.clang-format'
              - '.github/check-windows-deps.py'
              - '.github/workflows/pr-tests.yml'
              - '!*.md'
              - '!**/*.md'
            build_script:
              - 'build.py'
              - 'scripts/test/vcpkg_baseline_test.py'
              - '.github/workflows/pr-tests.yml'
            installer:
              - 'install.sh'
              - 'scripts/test/install_test.sh'
              - 'scripts/test/install_e2e.sh'
              # The git hook's suite rides this job because it is the only one
              # with a bash toolchain already stood up. Linting both of them is
              # `scripts` below, for every shell script at once.
              - 'scripts/pre-commit'
              - 'scripts/test/pre-commit_test.sh'
              - '.github/workflows/pr-tests.yml'
            # Globs rather than a list, deliberately: the `Script lint` job
            # takes its files from `git ls-files`, so a script added tomorrow is
            # linted the day it lands, and this filter has to be able to see the
            # same file or the job would never run on it.
            scripts:
              # Both forms of each glob, for the reason the `code` filter above
              # gives: the bare one covers root-level files (`install.sh`,
              # `build.py`), the `**/` one covers nested.
              - '*.sh'
              - '**/*.sh'
              - '*.py'
              - '**/*.py'
              - 'scripts/pre-commit'
              - '.github/workflows/pr-tests.yml'

      # The routing, said out loud. Every job below is gated on these six
      # booleans, and until this step existed the only way to answer "why did
      # the engine matrix run on a change that touched no engine source" was to
      # re-evaluate the globs by hand - which is how the doc-routing defect
      # above went unnoticed. Note that a change to *this file* routes to every
      # area on purpose, so a pull request editing the split sees the full
      # matrix regardless of what else it touches.
      - name: Report the routing
        shell: bash
        env:
          CODE: ${{ steps.code.outputs.code }}
          AREAS: ${{ toJSON(steps.area.outputs) }}
        run: |
          {
            echo "- non-documentation changes: \`$CODE\`"
            echo "- areas: \`$AREAS\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Lint, formatting and type-check are platform-independent, so one runner
  # answers for all three - they used to run inside the app job, where roughly
  # 1.2 min of them stood in front of the suite that is the job's whole point,
  # and the type-check ran a second and third time on runners that could not
  # answer differently. Out here they run beside the tests instead of ahead of
  # them (#805 phase 3).
  #
  # Nothing platform-specific is lost. `forceConsistentCasingInFileNames` makes
  # the casing question a *Linux* question, and tsc has no other per-platform
  # verdict; the matrix below exists for what the suite asserts at runtime, not
  # for what the compiler says about the same files three times.
  quality:
    name: App quality checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.app == 'true'
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: app
        run: pnpm lint

      - name: Check frontend formatting
        working-directory: app
        run: pnpm format:check

      # Three tsc projects, run concurrently by the script itself. A failing
      # project still fails the script - `concurrently` defaults to
      # `--success all` - and unlike the `&&` chain it replaced, all three now
      # report their errors in one run instead of stopping at the first.
      - name: Type-check frontend
        working-directory: app
        run: pnpm type-check

  app:
    name: App on ${{ matrix.os }}${{ matrix.shard && format(' (shard {0})', matrix.shard) || '' }}
    runs-on: ${{ matrix.os }}
    needs: changes
    # The second, third and fourth clauses are the one job those inputs need:
    # this is where `pnpm test` runs, so it is where every guard that reads one
    # of those files runs. The doc clause is an OR rather than another entry in
    # `app` because `code` rejects a documentation path too, and `code && app`
    # would answer false on the `code` half however the area filter were
    # written. The engine clause could have been ANDed with `code` - every path
    # it lists is source or fixture, never Markdown, so `code` is true whenever
    # it is - and is left bare to read as the clause beside it. The root clause
    # must be bare: half of it is `README.md`, which `code` rejects, so an AND
    # there would restore exactly the hole it closes. `quality` deliberately
    # keeps the plain condition: eslint reads TS/TSX, prettier's domain is
    # `app/` and tsc reads none of these files, so nothing it runs can change
    # colour over an edit to one.
    if: (needs.changes.outputs.code == 'true' && needs.changes.outputs.app == 'true') || needs.changes.outputs.app_doc_fixtures == 'true' || needs.changes.outputs.app_engine_inputs == 'true' || needs.changes.outputs.app_root_inputs == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # All three platforms, even though nothing here compiles. The suite
        # asserts platform behaviour (`platform.test.ts`, `updater.test.ts`) and
        # the macOS runner is the only one that has ever caught a regression in
        # the macOS branch - see the testing section of CLAUDE.md.
        #
        # Windows is split in two because it is the wall of every app-only pull
        # request: one unsharded run measured 7m35s-7m58s there against ~5 min
        # on the other two, for a 9m03s-9m12s job. The suite is already parallel
        # within a run (`pool: threads`, no worker cap) - the second runner buys
        # what more threads on one runner cannot. ubuntu and macOS stay
        # unsharded: they are not the wall, and a second runner each would cost
        # more than it saves.
        #
        # `shard` is the literal vitest argument, so the index and the count
        # cannot drift apart. Adding a third shard means adding `3/3` here *and*
        # renumbering the others - the coverage check in `ci-gate` fails loudly
        # if that is done by halves.
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
            shard: 1/2
          - os: windows-latest
            shard: 2/2
    # Roughly 4 minutes on the slowest runner; the ceiling is for a cold pnpm
    # store, not for the steady state.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # One step rather than two `if`-guarded ones, so the unsharded and sharded
      # invocations cannot drift. The json report is written only where it is
      # read - by the manifest step below.
      - name: Run frontend tests
        working-directory: app
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [[ -z "$SHARD" ]]; then
            pnpm test
          else
            pnpm test --shard="$SHARD" --reporter=default --reporter=json --outputFile.json=vitest-shard.json
          fi

      # A sharded suite is green when each shard is green, which is also true of
      # a shard that ran nothing at all. These two files are what makes the
      # difference visible: what this shard ran, and what the suite contains.
      # `ci-gate` unions them across the shards and compares.
      - name: Record what this shard ran
        if: matrix.shard
        id: manifest
        working-directory: app
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          index="${SHARD%%/*}"
          node scripts/shard-manifest.mjs vitest-shard.json > "shard-${index}.txt"
          pnpm exec vitest list --filesOnly | node scripts/shard-manifest.mjs - > "full-suite-${index}.txt"
          ran=$(wc -l < "shard-${index}.txt")
          total=$(wc -l < "full-suite-${index}.txt")

          # The manifest script already refuses an empty shard. This is the
          # other half: a shard that ran *everything* means `--shard` was
          # accepted and ignored, which reads as a pass while costing twice the
          # runner time it was meant to save.
          if [[ "$ran" -ge "$total" ]]; then
            echo "::error::Shard $SHARD ran $ran of $total files - the shard argument did not take effect"
            exit 1
          fi

          echo "artifact=vitest-shard-manifest-${index}" >> "$GITHUB_OUTPUT"
          echo "- shard \`$SHARD\` ran **$ran** of **$total** test files" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload this shard's manifest
        if: matrix.shard
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.manifest.outputs.artifact }}
          path: |
            app/shard-*.txt
            app/full-suite-*.txt
          if-no-files-found: error
          retention-days: 1

  engine:
    name: Engine on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.engine == 'true'
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # VAYU_WERROR turns the GCC/Clang warning set into build errors, on
          # both legs that use it (issue #884) - a warning that only one
          # compiler emits is exactly the kind this gate exists to catch, so
          # gating Linux alone would leave Clang-only diagnostics unwatched.
          # Windows needs no flag: MSVC builds /WX unconditionally.
          - os: ubuntu-latest
            preset: linux-prod
            configureArgs: "['-DVAYU_BUILD_TESTS=ON', '-DVAYU_WERROR=ON']"
          - os: windows-latest
            preset: windows-prod
            configureArgs: "['-DVAYU_BUILD_TESTS=ON']"
          - os: macos-latest
            preset: macos-prod
            configureArgs: "['-DVAYU_BUILD_TESTS=ON', '-DVAYU_WERROR=ON']"
    # 90, not 60. A normal pull request finishes this job in 5-11 minutes, so
    # the timeout is a runaway guard rather than a budget - but a pull request
    # that touches a large number of engine sources makes the clang-tidy step
    # dominate, because clang-tidy parses a whole translation unit per changed
    # file no matter how few of its lines changed. #886's 149-file reformat hit
    # the old 60 on Linux and Windows alike with clang-tidy still running. The
    # headroom is for that shape of change; nothing routine goes near it.
    timeout-minutes: 90
    env:
      VCPKG_COMMIT: '94a541197763a4f449a1b91478df48c0584a6256'
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-archives,readwrite'
      SCCACHE_GHA_ENABLED: 'true'

    steps:
      # Depth 2, which is all the clang-tidy step below needs: `HEAD^1`, the
      # base side of the merge commit actions/checkout leaves at HEAD. It was
      # briefly full history, for a commit walk that read the pull request's own
      # commits; that walk is gone (#940) and so is its clone cost.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            build-essential \
            pkg-config \
            ca-certificates \
            autoconf \
            autoconf-archive \
            automake \
            libtool

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        # autoconf-archive and friends are for vcpkg's libsodium, which builds
        # from source through its autotools path and runs autoreconf first.
        # brew's libtool provides glibtoolize, which vcpkg accepts in place of
        # libtoolize.
        run: |
          command -v ninja || brew install ninja
          for pkg in autoconf autoconf-archive automake libtool; do
            brew list --formula "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: Cache vcpkg compiled packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('engine/vcpkg.json') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('engine/vcpkg.json') }}-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'
          vcpkgJsonGlob: 'engine/vcpkg.json'

      # sccache used to be skipped on Windows. sccache-action@v0.0.10 failed its
      # install step on the Windows Server 2025 + Visual Studio 2026 image
      # GitHub rolled across windows-latest in June 2026: "Unable to locate
      # executable file: undefined" in the post-step, which took every
      # downstream build and test step with it.
      #
      # v0.0.11 bumps @actions/io from 2.x to 3.x, and `which()` in that package
      # is what raises exactly that error, so the skip is lifted here to find
      # out whether it is fixed. Windows was the one runner that had never
      # exercised this action, and a skip cannot tell you it is still needed.
      # If the engine job goes red on windows-latest, put
      # `if: runner.os != 'Windows'` back on both steps; the build is slower
      # without sccache but reliable.
      #
      # The launcher is safe on MSVC here because windows-prod is a Release
      # build - CMake passes no /Zi, so there is no separate PDB for sccache to
      # choke on. Check that again before enabling it for windows-dev (Debug).
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure sccache compiler launcher
        shell: bash
        run: |
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"

      - name: Build engine
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/engine/CMakeLists.txt'
          configurePreset: ${{ matrix.preset }}
          buildPreset: ${{ matrix.preset }}
          configurePresetAdditionalArgs: "${{ matrix.configureArgs }}"

      # The engine must depend on nothing outside Windows itself. ctest below
      # runs on a runner that already has the Visual C++ redistributable, so it
      # cannot tell a self-contained binary from one that only works here -
      # which is exactly how v0.10.0 and v0.11.0 shipped an engine that could
      # not start on a clean machine. This inspects the import table instead.
      - name: Verify engine has no non-Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --quiet pefile
          python .github/check-windows-deps.py engine/build-release/vayu-engine.exe

      # `< /dev/null` is what a shell step already gives ctest here, written
      # down so it stays true: release.yml pins the same redirect on its own
      # ctest steps, and the pair is the contract that the suite sees one stdin
      # in both places. Without it the release path ran ctest under
      # `lukka/run-cmake`, whose child gets an unwritten pipe - which is how the
      # v0.16.0 stdin failure passed every pull request and failed on the tag.
      # See #589; drop the redirect on one side and that class is reachable
      # again.
      - name: Run engine tests
        working-directory: engine
        shell: bash
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --output-junit "$GITHUB_WORKSPACE/engine/test-results.xml" < /dev/null

      # The clang-tidy gate (#885). It rides this job rather than standing up its
      # own because it needs `compile_commands.json` and a configured tree - a
      # separate job would pay the vcpkg install and the configure a second time
      # for a check that takes seconds against a warm build. After ctest, so a
      # genuine regression is reported before a lint finding is.
      #
      # **On Linux and Windows, not Linux alone**, for the reason `VAYU_WERROR`
      # is set on two legs above: a diagnostic only one platform can emit is
      # exactly what a gate is for. clang-tidy analyses a *translation unit*, so
      # an `#ifdef _WIN32` branch is preprocessed away before the Linux run sees
      # a token - `platform.hpp`'s per-OS split and the Windows-only blocks in
      # `client.cpp`, `event_loop_worker.cpp` and `temp_database.hpp` were code
      # no lint could reach until the Windows leg ran.
      #
      # macOS is excluded. That is a settled decision (#940), not an open
      # regression: clang-tidy 19.1.7 and 20.1.8 both die there with SIGILL - an
      # `llvm_unreachable` trap - part way through the two heaviest translation
      # units, which lint clean on both other legs. Upstream clang cannot parse
      # that runner's AppleClang 21 SDK, and two consecutive majors failing the
      # same way is not a version ladder worth climbing here. The coverage lost
      # is small and measured: the engine's entire macOS-conditional surface is
      # four `#define`s in `platform.hpp` with no statement in them, so what is
      # actually missed is `clang-analyzer-*` over shared code as compiled
      # against libc++. Lint coverage on two of three platforms is a common and
      # accepted posture. The one condition that reopens it: a Homebrew LLVM
      # that survives both translation units on the runner's current SDK - try
      # it by dropping this `if`, and put it back if it traps.
      #
      # **Both legs lint the whole of every changed file** (#946 promoted
      # Linux, #1023 the Windows leg behind it). The gate opened at
      # changed-*lines* scope on both (#885), because the engine had never
      # been linted and most files carried findings older than any diff -
      # whole-file gating then would have failed pull requests for code they
      # did not write. #928 paid that backlog to zero tree-wide *as measured
      # on the Linux toolchain*, which is why the promotion came in two
      # halves: the Windows leg's clang-tidy 20 over MSVC sees a translation
      # unit Linux never compiles and macros Linux never expands, and its own
      # whole-tree scan (`engine-tidy-scan.yml`, #1023) had to reach zero
      # before its scope could move. Both halves measured what the scoping had
      # cost: a retyped constant created a finding on a line its diff never
      # touched (#979), one branch's whole-file lint of its own 30 changed
      # files found 98 findings where the changed-lines gate, correctly,
      # reported 0 (#946), and the first whole-file lint on Windows reported
      # ~85 more in one pull request's touched files (#1022).
      #
      # `HEAD^1` is the base side of the pull request's merge commit, which is
      # what actions/checkout leaves at HEAD for a `pull_request` event; hence
      # `fetch-depth: 2` above, and the check below rather than a silent empty
      # diff if that ever stops being true.
      #
      # **A bulk reformat is the one change this gate cannot price fairly**: it
      # touches a line in every file, so the gate would parse one translation
      # unit per reformatted file - #886's 149-file bulk format asked for 152
      # translation units and hit this job's timeout. The escape is the
      # `reformat-pr` label in the `if` below: a reviewer applies it to a pull
      # request that is nothing but the formatter's output, sees it on the pull
      # request, and the lint step does not run. It is deliberately not
      # machinery - a commit walk that read the skip out of a file in the diff
      # was tried (#909's bootstrap) and deleted (#940), because a gate whose
      # exemption is an author-writable input needs a second gate to guard it.
      # `.git-blame-ignore-revs` still gets the reformat's SHA, for blame, which
      # is the only thing it is for.
      #
      # `--allow-no-checks` is for `engine/src/runtime/`, whose `.clang-tidy`
      # sets `Checks: '-*'`: without it clang-tidy calls an empty check list a
      # usage error and exits 1, so the directory that is meant to be exempt
      # would be the one that fails.
      #
      # The two legs run different clang-tidy versions, and neither is a free
      # choice. Linux pins 19 from apt, which is what CONTRIBUTING.md tells
      # contributors to install, so a local run and this one answer the same.
      # Windows takes the 20.1.8 its image already ships: chocolatey refuses to
      # downgrade to 19 ("A newer version of llvm is already installed"), and
      # using the image's copy costs no install time.
      #
      # 19 is the floor `engine/.clang-tidy` needs (`ExcludeHeaderFilterRegex`),
      # and it is asserted below rather than trusted, because an image is a pin
      # somebody else controls. The cost of the spread is that a finding on one
      # leg alone may be a version difference rather than a platform one - worth
      # knowing when you read a failure, and much cheaper than having no
      # coverage of the per-OS branches at all.
      - name: Lint changed engine sources
        if: >-
          runner.os != 'macOS'
          && !contains(github.event.pull_request.labels.*.name, 'reformat-pr')
        shell: bash
        run: |
          # Assert HEAD *is* the merge commit, by asking for the second parent.
          # Checking that HEAD^1 merely exists is not the same thing and is worse
          # than useless: on an ordinary commit it succeeds and silently makes
          # the base the previous commit, so the gate would lint the last commit
          # of the pull request and report a pass for the rest.
          if ! git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            echo "::error::HEAD is not the pull request merge commit (it has no second parent), so HEAD^1 is not the base of this pull request"
            exit 1
          fi

          roots=(engine/src engine/include engine/tests)

          # A read loop rather than `mapfile`: `shell: bash` on the macOS runner
          # is /bin/bash 3.2.57, where mapfile does not exist. The installer job
          # names that trap already - it is the same one, one job over.
          changed=()
          while IFS= read -r file; do
            changed+=("$file")
          done < <(git diff --name-only HEAD^1 HEAD -- "${roots[@]}" \
            | grep -E '\.(c|cpp|h|hpp)$' || true)

          # **This gate lints translation units. A header is never an input**,
          # on any platform - decided in #940, where it was Windows-only.
          #
          # `compile_commands.json` holds one entry per translation unit and so
          # none for a `.hpp`, so clang-tidy synthesises a command for a header
          # handed to it directly. That command is a guess, and when the guess
          # is wrong the failure is not a lint finding but a parse failure of
          # the standard library - `no template named 'optional' in namespace
          # 'std'`, twenty errors deep, in files no diff line touched (#926 on
          # Windows, where the same run linted every changed `.cpp` cleanly).
          # Feeding clang-tidy a file the compilation database has no entry for
          # is the only way this tree produces a compiler error at all, so
          # headers stay out of the input list.
          #
          # The MSVC include paths could be passed through instead
          # (`--extra-arg=-imsvc...`, re-derived per image). Rejected: it buys
          # header-as-input coverage on one more leg, at the price of toolchain
          # plumbing that breaks when an image moves.
          #
          # What the promotion changed here (#946): with no line filter on the
          # invocation, the config's `HeaderFilterRegex` applies, so a header's
          # findings now surface through every *changed* translation unit that
          # includes it. What a header-only pull request still needs is the
          # hook, which lints a staged header directly against the
          # contributor's own build tree - the summary note below says so.
          headers=()
          translation_units=()
          for file in ${changed[@]+"${changed[@]}"}; do
            case "$file" in
              *.h | *.hpp) headers+=("$file") ;;
              *) translation_units+=("$file") ;;
            esac
          done
          if [[ ${#headers[@]} -gt 0 ]]; then
            {
              echo "- clang-tidy: **${#headers[@]}** changed header(s) are not direct inputs here - this gate lints translation units only (#940). Their findings surface through any changed source that includes them (#946, #1023); \`scripts/pre-commit\` lints them directly:"
              printf '  - `%s`\n' "${headers[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          changed=(${translation_units[@]+"${translation_units[@]}"})

          # The non-empty-scan proof this repository asks of every source
          # scanning guard: name what is about to be linted, so a step that
          # silently narrowed to nothing cannot read as a pass. The only thing
          # that narrows the set now is the Windows header split above, and it
          # names every file it dropped.
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "- clang-tidy: no engine source to lint on this leg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "- clang-tidy linted **${#changed[@]}** whole engine source(s) changed against \`$(git rev-parse --short HEAD^1)\` (#946, #1023):"
            printf '  - `%s`\n' "${changed[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

          # Installed here rather than in a step of its own so a pull request
          # that changed no engine source pays for none of it. Both legs now
          # name the binary and nothing else: `clang-tidy-diff.py` went with
          # #1023, which was the last thing that needed a driver script and a
          # Python beside it.
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get install -y --no-install-recommends clang-tidy-19
              tidy=clang-tidy-19
              ;;
            Windows)
              # Nothing to install: the image ships LLVM 20.1.8, and asking
              # chocolatey for 19.1.1 failed outright rather than downgrading
              # ("A newer version of llvm is already installed").
              tidy="/c/Program Files/LLVM/bin/clang-tidy.exe"
              ;;
            *)
              echo "::error::No clang-tidy 19 recipe for $RUNNER_OS"
              exit 1
              ;;
          esac

          # Named before anything depends on it: a clang-tidy that resolved to
          # the wrong place would otherwise surface as an unrelated shell error.
          "$tidy" --version

          # The floor, asserted rather than assumed. Two of the three legs take
          # whatever LLVM their runner image ships, so an image that rolled
          # backwards would lint with a binary that cannot read
          # `engine/.clang-tidy` at all - which is issue #659's silent empty
          # scan arriving by a new route.
          major="$("$tidy" --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -1)"
          if [[ -z "$major" ]] || [[ "$major" -lt 19 ]]; then
            echo "::error::clang-tidy ${major:-(version unreadable)} is below the 19 that engine/.clang-tidy requires"
            exit 1
          fi

          # clang-tidy replays the compile command, precompiled header and all -
          # and that PCH was written by the *build's* compiler, not by
          # clang-tidy's clang. On Linux it is a GCC `.gch` ("not a clang PCH
          # file"); on macOS it is an AppleClang PCH in a format Homebrew's
          # clang 19 refuses ("newer PCH format that cannot be read"). Under the
          # prod presets' -Werror / /WX both are hard errors raised before any
          # check filter, and neither carries a line the diff filter could
          # match, so every file fails.
          #
          # Regenerating the compile database without the PCH is the fix that
          # does not depend on knowing each compiler's PCH flag spelling. It is
          # safe to do in place: ctest has already run, so nothing needs this
          # build tree again. The sources parse without it; CMake's PCH is a
          # build-time accelerator here, not something they lean on.
          #
          # `VCPKG_MANIFEST_INSTALL=OFF` is what keeps that cheap, and it is not
          # optional: the vcpkg toolchain re-runs the manifest install on every
          # configure, which measured **563 seconds** here - nine and a half
          # minutes added to the engine job for a lint step that takes under a
          # minute. Skipping it costs nothing, because the dependencies this
          # tree was built against are already installed in it; the reconfigure
          # then takes 0.2s and the vcpkg include paths survive untouched.
          cmake -S engine -B engine/build-release \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DVCPKG_MANIFEST_INSTALL=OFF
          if grep -q cmake_pch engine/build-release/compile_commands.json; then
            echo "::error::compile_commands.json still references a precompiled header"
            exit 1
          fi

          # **One invocation for both legs, and the scope is measured rather
          # than preferred** (#946 promoted Linux, #1023 Windows). Each leg's
          # whole-tree scan had to reach zero first, because promoting one
          # ahead of its own measurement fails pull requests for code they did
          # not write - the exact failure changed-lines scoping existed to
          # prevent. Linux's zero is #928's, on clang-tidy 19 over GCC compile
          # commands. Windows's is #1023's, on clang-tidy 20 over MSVC: the
          # `pro-type-vararg` on every libcurl option call that only this leg
          # can see (the option setters are one typed primitive now,
          # `curl_options.hpp`, holding the one NOLINT), the checks that exist
          # only in clang-tidy 20, and the findings in Windows-only code Linux
          # never compiles. `engine-tidy-scan.yml` is how either is
          # re-measured.
          #
          # Whole files, one clang-tidy invocation per changed translation
          # unit, in parallel. GNU xargs exits non-zero when any invocation
          # fails, which `WarningsAsErrors: '*'` makes every finding do. Header
          # findings surface through the translation units that include them,
          # per the config's `HeaderFilterRegex` - headers are still never
          # inputs. `nproc` is coreutils and ships with Git for Windows, so it
          # answers on both legs.
          printf '%s\0' "${changed[@]}" \
            | xargs -0 -n 1 -P "$(nproc)" \
                "$tidy" -p engine/build-release --quiet --allow-no-checks

      # The escape says so in the job summary as well as on the pull request.
      # Same rule as the step above: a gate that narrowed to nothing must not
      # read as a clean pass, and "the lint step is missing" is easy to miss.
      - name: Note the lint skip
        if: >-
          runner.os != 'macOS'
          && contains(github.event.pull_request.labels.*.name, 'reformat-pr')
        shell: bash
        run: |
          echo "- clang-tidy: **skipped** - this pull request carries the \`reformat-pr\` label, so it is the formatter's output and nothing else. Remove the label to lint it." >> "$GITHUB_STEP_SUMMARY"

      # `always()` so a suite that ran and failed is still reported - but on its
      # own that also reports a *pass* for a job that never got as far as
      # running a test. When `Build engine` fails or the job is cancelled,
      # `Run engine tests` is skipped, no report file is written, and the action
      # defaults to publishing a green `C++ Tests ()` check over nothing at all
      # (seen on runs 31379169990 and 31378525863, where the Windows engine had
      # not compiled). `require_tests` is what closes that: a missing report
      # fails this step instead of inventing a pass, and the action returns
      # before creating any check run. The legitimate no-report case - a
      # docs-only change - never reaches here, because `changes.outputs.code`
      # skips the whole job.
      #
      # `fail_on_failure` stays off deliberately, so the pair is a decision and
      # not a default: `Run engine tests` above already fails the job on a red
      # suite, and turning this on would make one failing test fail two steps.
      - name: Publish C++ test results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'engine/test-results.xml'
          check_name: 'C++ Tests (${{ matrix.os }})'
          require_tests: true
          fail_on_failure: false

  # The clang-format gate (#886). A job of its own rather than a step of the
  # engine matrix, for the reason `quality` is a job of its own: formatting is
  # platform-independent and needs no compile database, so riding the engine job
  # would put a two-second check behind a five-to-eleven-minute vcpkg build and
  # then run it three times for one answer. Out here it reports in under a
  # minute, beside the suites.
  #
  # **Whole tree** - wider still than the clang-tidy gate one job up, which
  # since #946 lints the whole of every changed file but never parses an
  # unchanged one (a lint costs a translation-unit parse; a format check does
  # not). Formatting never had a backlog: the bulk-format commit in
  # `.git-blame-ignore-revs` left all 285 non-vendor sources clean at the
  # pinned version, so the strict check is the cheap one and it cannot fail a
  # pull request for code it did not write.
  #
  # `engine/vendor/` is excluded by the roots below, and carries
  # `DisableFormat: true` of its own besides.
  engine-format:
    name: Engine formatting
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.engine == 'true'
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 19, the same major the clang-tidy gate pins on Linux and the same one
      # CONTRIBUTING.md tells contributors to install, so one LLVM answers for
      # both checks and a local run means what this one means. It is not a free
      # choice: 39 of the 285 engine sources format differently under 18 than
      # under 19, so an unpinned `clang-format` would fail pull requests over
      # whichever version a contributor's distribution happened to ship.
      - name: Install clang-format 19
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-19

      - name: Check engine formatting
        shell: bash
        run: |
          # Asserted rather than trusted, on the pattern the clang-tidy step
          # uses: apt could satisfy `clang-format-19` from a package that moved
          # on, and a version this check did not expect is a wrong answer rather
          # than a missing one.
          major=$(clang-format-19 --version | grep -oE '[0-9]+' | head -1)
          if [[ "$major" != "19" ]]; then
            echo "::error::clang-format ${major:-(version unreadable)} is not the 19 this gate and CONTRIBUTING.md pin"
            exit 1
          fi

          roots=(engine/src engine/include engine/tests)

          # `git ls-files` rather than an enumerated list, so a source file
          # added tomorrow is covered without anyone remembering to add it here.
          # A read loop rather than `mapfile` only to match the engine job's
          # idiom - this leg is Ubuntu-only, so the bash 3.2.57 constraint that
          # forces it one job up does not apply here.
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(git ls-files -- "${roots[@]}" | grep -E '\.(c|cpp|h|hpp)$')

          # The non-empty-scan proof this repository asks of every source
          # scanning guard. A roots list that stopped matching - a directory
          # renamed, a glob typo - would otherwise check nothing and report a
          # pass, which is the one failure mode a formatting gate cannot survive
          # quietly.
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No engine sources matched ${roots[*]} - this gate scanned nothing, which is a failure and not a pass"
            exit 1
          fi
          echo "- clang-format $major checked **${#files[@]}** engine source(s)" >> "$GITHUB_STEP_SUMMARY"

          clang-format-19 --style=file --dry-run -Werror "${files[@]}"

  installer:
    name: Installer script on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.installer == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # macOS as well as Linux because install.sh is the macOS installer and
        # its dry-run test exercises the real `codesign`/`xattr` call sites.
        # Windows is absent for the same reason it was absent before the split:
        # there is no shell to run it in.
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Only the suites run here. shellcheck used to run beside each of them,
      # over the five scripts this job happens to own; it now runs once over
      # every tracked script in the `Script lint` job below (#887), which is
      # both cheaper - one runner instead of this two-runner matrix - and the
      # only version of it that a newly added script cannot escape.
      - name: Test installer script
        shell: bash
        run: bash scripts/test/install_test.sh

      # The pre-commit hook's clang-tidy version probe (#659). Linux only: the
      # hook prepends Homebrew's LLVM directory when it exists, which shadows
      # the stubbed clang-tidy the suite drives it with, and the probe has no
      # platform-specific half worth running twice.
      - name: Test the pre-commit hook
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/test/pre-commit_test.sh

      # The dry-run suite above asserts on the commands the installer would have
      # run. This one runs it: a real download from a local release, a real
      # extraction, placement, update and uninstall, into a temporary root. It
      # is the only thing here that exercises ditto, codesign and the swap on
      # macOS, or a genuine mv-into-place on Linux - and both bugs that made the
      # Linux path unusable were invisible to a dry run.
      - name: End-to-end install, update and uninstall
        shell: bash
        run: bash scripts/test/install_e2e.sh

      # `bash` on the macOS runner is Homebrew's 5.x, but a stock Mac has only
      # /bin/bash 3.2.57 - and the documented command resolves `bash` from PATH,
      # so that is what most users actually run this under. Nothing in the
      # script needs bash 4, and this is what keeps it that way: a `mapfile`, an
      # associative array or a `${var,,}` would pass every other job and fail on
      # every Mac.
      - name: Test installer under macOS's own bash 3.2
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -1
          /bin/bash scripts/test/install_test.sh
          /bin/bash scripts/test/install_e2e.sh

  # build.py's plumbing, on its own job because it needs neither a C++ toolchain
  # nor Node: throwaway git repositories and python3. Linux only - the code under
  # test shells out to git, which behaves the same on every runner. This and
  # `Script lint` are the only jobs that read build.py at all: the app and
  # engine jobs build through pnpm and the cmake presets directly, which is why
  # the area filters above no longer route build.py edits into their matrices.
  build-script:
    name: Build script
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.build_script == 'true'
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Test the stale-vcpkg-baseline self-heal
        run: python3 scripts/test/vcpkg_baseline_test.py

  # The repository's two unlinted languages (#887). Both checks are seconds of
  # work on a runner that needs neither a C++ toolchain nor Node, so they share
  # one Linux job rather than riding a matrix that would run each of them two or
  # three times for one answer - the same reasoning that gave `quality` its own
  # job.
  #
  # Both take their files from `git ls-files`, not an enumerated list. The list
  # this replaces had drifted to five of the twelve tracked shell scripts, and an
  # enumeration cannot do better: it records what existed the day it was written.
  # An empty file list fails rather than passing, per CLAUDE.md - a scan that
  # looked at nothing is the one failure mode a lint gate cannot survive quietly.
  scripts:
    name: Script lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.scripts == 'true'
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Pinned. Ubuntu's apt and Homebrew ship different versions, and
      # shellcheck's findings differ between them: a file clean under one has
      # twice failed here on a rule the other does not emit, and once the *same*
      # finding arrived under a different code (SC2317 in 0.9/0.10, SC2329 in
      # 0.11). Pinning makes a local run mean something, and moves a version
      # bump into a commit someone chose to make.
      - name: Install shellcheck
        shell: bash
        env:
          SHELLCHECK_VERSION: v0.10.0
        run: |
          case "$(uname -m)" in
            x86_64)  target=linux.x86_64 ;;
            aarch64) target=linux.aarch64 ;;
            *) echo "::error::No pinned shellcheck build for $(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.${target}.tar.xz"
          curl -fsSL "$url" | tar -xJ
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # `scripts/pre-commit` is named on its own because it carries no
      # extension; `engine/vendor/` is dropped because upstream's scripts are
      # not ours to keep clean.
      - name: Shellcheck every tracked shell script
        shell: bash
        run: |
          mapfile -t files < <(git ls-files -- '*.sh' 'scripts/pre-commit' | grep -v '^engine/vendor/')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No shell scripts to check - the file list is broken, not the tree"
            exit 1
          fi
          printf '  %s\n' "${files[@]}"
          shellcheck "${files[@]}"

      # Pinned for the reason shellcheck is, and one more: ruff's default rule
      # set grows between releases, so an unpinned gate can turn a pull request
      # red over a rule that arrived in a version bump nobody made.
      - name: Install ruff
        shell: bash
        env:
          RUFF_VERSION: 0.15.8
        run: |
          python3 -m pip install --disable-pip-version-check "ruff==${RUFF_VERSION}"
          ruff --version

      # Default rules only. The tree is clean against them after #887, and a
      # wider selection is not: `--select F,E,W` reports 122 findings, nearly
      # all line length in build.py, which is a reformat rather than a lint fix
      # and belongs in a change someone chose to make.
      - name: Ruff every tracked Python file
        shell: bash
        run: |
          mapfile -t files < <(git ls-files -- '*.py' | grep -v '^engine/vendor/')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No Python files to check - the file list is broken, not the tree"
            exit 1
          fi
          printf '  %s\n' "${files[@]}"
          ruff check --no-cache "${files[@]}"

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    # `changes` is a dependency as well as the work jobs, so a failure in the
    # filter cannot be read as "nothing to test". Without it, a broken `changes`
    # job skips everything, and "skipped" would pass this gate on a change
    # nobody ran.
    needs: [changes, quality, app, engine, engine-format, installer, build-script, scripts]
    if: always()
    # `actions: read` is what lets the download below reach this run's own
    # artifacts; everything else here reads job results, which need nothing.
    permissions:
      contents: read
      actions: read
    steps:
      # The shard coverage proof lives here rather than in a job of its own
      # because this is the only job that already runs after both Windows
      # shards, and two file downloads add seconds to it instead of a runner
      # start to the wall clock. It runs before the result check below so that a
      # suite which was half-run is reported as such even on a run where every
      # job is green - which is exactly the shape of the failure it guards.
      - name: Collect the app shard manifests
        if: needs.app.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-shard-manifest-*
          merge-multiple: true
          path: shard-manifests

      - name: Prove the shards ran the whole suite between them
        if: needs.app.result == 'success'
        shell: bash
        run: |
          shopt -s nullglob
          manifests=(shard-manifests/shard-*.txt)
          suites=(shard-manifests/full-suite-*.txt)

          # One manifest per sharded leg. A count that is not 2 means the matrix
          # gained or lost a shard without this number following it - the case
          # where `1/2` and `2/3` coexist and a third of the suite runs nowhere.
          if [[ ${#manifests[@]} -ne 2 || ${#suites[@]} -ne 2 ]]; then
            echo "::error::Expected 2 shard manifests, found ${#manifests[@]}"
            exit 1
          fi

          # Both shards enumerate the suite from the same commit, so a
          # disagreement means one of them was looking at a different tree and
          # the comparison below would prove nothing.
          if ! diff -u "${suites[0]}" "${suites[1]}"; then
            echo "::error::The shards disagree about which test files exist"
            exit 1
          fi

          duplicated=$(sort "${manifests[@]}" | uniq -d)
          if [[ -n "$duplicated" ]]; then
            echo "::error::Shards overlap - these files ran twice:"
            echo "$duplicated"
            exit 1
          fi

          sort -u "${manifests[@]}" > union.txt
          if ! diff -u union.txt "${suites[0]}"; then
            echo "::error::The shards did not run every test file (- ran, + expected)"
            exit 1
          fi

          echo "- Windows shards covered all **$(wc -l < union.txt)** test files, none twice" >> "$GITHUB_STEP_SUMMARY"

      - name: Pass if every job succeeded or was skipped
        run: |
          changes="${{ needs.changes.result }}"
          if [[ "$changes" != "success" ]]; then
            echo "CI failed (change detection: $changes)"
            exit 1
          fi

          # Each work job is skipped when its tree was untouched, which is the
          # whole point of the split - so "skipped" passes here exactly as it
          # did when there was a single `test` job. Anything else (failure,
          # cancelled) fails the gate.
          status=0
          check() {
            if [[ "$2" == "success" || "$2" == "skipped" ]]; then
              echo "  $1: $2"
            else
              echo "  $1: $2  <-- failed"
              status=1
            fi
          }
          check quality   "${{ needs.quality.result }}"
          check app       "${{ needs.app.result }}"
          check engine    "${{ needs.engine.result }}"
          check engine-format "${{ needs['engine-format'].result }}"
          check installer "${{ needs.installer.result }}"
          check build-script "${{ needs['build-script'].result }}"
          check scripts   "${{ needs.scripts.result }}"

          if [[ $status -ne 0 ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
