name: Publish to winget (manual)

# Manual counterpart to the `publish-winget` job in release.yml.
#
# That job fires automatically when a release tag is pushed, which covers the
# normal case. This one exists for everything else:
#
#   - a release that predates the automation (v0.11.0 was tagged ~15h before
#     the auto job merged, so it was never submitted and winget stayed on
#     0.10.0 with nothing failing to show for it)
#   - re-submitting after a winget-pkgs pull request was closed or rejected
#   - publishing an older tag deliberately
#
# It submits an *existing* GitHub release to winget-pkgs and builds nothing, so
# it takes seconds rather than running the two-hour three-platform matrix that
# release.yml's own workflow_dispatch path would.

on:
  workflow_dispatch:
    inputs:
      # Free text rather than a dropdown on purpose: workflow_dispatch `choice`
      # options must be a static list literal in this file, with no expression
      # or API lookup available, so a dropdown would have to be hand-edited on
      # every release and would silently go stale the moment someone forgot.
      # Leaving this empty picks the latest release, which is the common case;
      # an unrecognised tag is rejected below with the available ones listed.
      tag:
        description: 'Release tag to publish, e.g. v0.11.0. Leave empty for the latest release.'
        required: false
        type: string

# Serialise with itself so two runs cannot race to open competing pull requests
# against winget-pkgs for the same package.
concurrency:
  group: winget-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Submit manifest to winget-pkgs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A manual run must fail loudly when it cannot work. The automatic job in
      # release.yml deliberately skips when the secret is absent, so that
      # landing it before setup could never fail a release tag - but here the
      # operator explicitly asked for a submission, and a green tick that
      # published nothing would be worse than an error.
      #
      # This checks the token can actually publish, not merely that it exists.
      # Every prerequisite below surfaces from komac as the same opaque line -
      # "<user> does not have the correct permissions to execute `CreateRef`" -
      # after it has already downloaded the installer and rendered all three
      # manifests, naming neither which prerequisite failed nor which repository
      # it was denied on. v0.16.0 was lost to exactly that: an expired token
      # reported as a permissions error, indistinguishable from a missing fork.
      # Each check below names its own failure, before any work is done.
      - name: Verify WINGET_TOKEN can publish
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${WINGET_TOKEN:-}" ]; then
            echo "::error::WINGET_TOKEN is not set. Create a *classic* PAT with the" \
                 "public_repo scope (fine-grained PATs are not supported by" \
                 "winget-releaser) and add it as a repository secret."
            exit 1
          fi

          status=$(curl -sS -o user.json -D user.headers -w '%{http_code}' \
                   -H "Authorization: token $WINGET_TOKEN" https://api.github.com/user)
          if [ "$status" != "200" ]; then
            echo "::error::WINGET_TOKEN did not authenticate (HTTP $status) - it has" \
                 "most likely expired. Mint a new classic PAT with public_repo scope" \
                 "and update the repository secret."
            exit 1
          fi

          # A classic PAT reports its scopes in x-oauth-scopes. A fine-grained PAT
          # omits the header entirely, so an empty value here is itself the
          # diagnosis rather than a missing scope.
          login=$(jq -r .login user.json)
          scopes=$(grep -i '^x-oauth-scopes:' user.headers | cut -d: -f2- | tr -d '\r' | xargs || true)
          echo "Authenticates as: $login"
          echo "Scopes: ${scopes:-<none - this is a fine-grained PAT>}"

          case ",${scopes// /}," in
            *,public_repo,* | *,repo,*) ;;
            *)
              echo "::error::WINGET_TOKEN lacks the public_repo scope (scopes:" \
                   "${scopes:-none}). winget-releaser needs a *classic* PAT with" \
                   "public_repo; a fine-grained PAT reports no scopes at all and" \
                   "cannot create the submission branch."
              exit 1
              ;;
          esac

          # komac branches in the fork named by KOMAC_FORK_OWNER, which the action
          # defaults to this repository's owner. The token must own that fork: a
          # token for a different account authenticates perfectly and is then
          # denied here, which is why the check is against $login rather than
          # against the repository owner.
          fork="$login/winget-pkgs"
          status=$(curl -sS -o fork.json -w '%{http_code}' \
                   -H "Authorization: token $WINGET_TOKEN" "https://api.github.com/repos/$fork")
          if [ "$status" != "200" ]; then
            echo "::error::$fork is not reachable with this token (HTTP $status)." \
                 "Fork microsoft/winget-pkgs to $login - komac creates its branch" \
                 "there, and without the fork the attempt lands on" \
                 "microsoft/winget-pkgs itself and is refused."
            exit 1
          fi

          push=$(jq -r '.permissions.push' fork.json)
          archived=$(jq -r '.archived' fork.json)
          parent=$(jq -r '.parent.full_name // "<not a fork>"' fork.json)
          echo "$fork: push=$push archived=$archived parent=$parent"

          if [ "$push" != "true" ] || [ "$archived" != "false" ]; then
            echo "::error::WINGET_TOKEN cannot write to $fork (push=$push," \
                 "archived=$archived). An archived fork reports push=true and still" \
                 "rejects every write, so unarchive it rather than re-minting the token."
            exit 1
          fi

          if [ "$parent" != "microsoft/winget-pkgs" ]; then
            echo "::error::$fork is not a fork of microsoft/winget-pkgs (parent:" \
                 "$parent). A plain copy of the repository is not detected as the" \
                 "fork; delete it and fork microsoft/winget-pkgs afresh."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Resolve and validate before submitting, so a typo produces a clear
      # message here instead of a confusing failure inside the action - or,
      # worse, a manifest pointing at an asset that does not exist.
      - name: Resolve release and version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
            echo "No tag given, using the latest release: $tag"
          fi

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # No dropdown is possible for the input, so make the failure do that
            # job instead: name the tags that would have worked.
            available=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 15 \
                        --json tagName -q '.[].tagName' | paste -sd ', ' -)
            echo "::error::No GitHub release found for tag '$tag'. Available: $available"
            exit 1
          fi

          # The manifest records a download URL and a hash of that exact asset,
          # so a release without the Windows installer must not be submitted.
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
               --json assets -q '.assets[].name' | grep -qx 'Vayu-x64.exe'; then
            echo "::error::Release '$tag' has no Vayu-x64.exe asset to publish."
            exit 1
          fi

          # PackageVersion carries no leading 'v'. The action strips it only
          # from the tag it defaults to, never from a value passed in - and on
          # workflow_dispatch the ref is a branch, so letting it default here
          # would try to publish a version literally called "master". Strip it
          # ourselves and pass it explicitly; that is exact either way.
          version="${tag#v}"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Submitting athrvk.Vayu $version from tag $tag"

      # `max-versions-to-keep` is deliberately NOT set here, unlike the
      # automatic job in release.yml which prunes to the five newest. This
      # workflow exists partly to publish an older tag on purpose, and pruning
      # keeps the newest N - so it could delete the very version being
      # submitted, in the same run, and report success. Leaving it unbounded
      # means a manual submission always does what was asked. The cap is not
      # lost: the next tagged release prunes back to five, so the invariant is
      # restored automatically rather than fought here.
      - name: Submit manifest to winget-pkgs
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: athrvk.Vayu
          version: ${{ steps.resolve.outputs.version }}
          release-tag: ${{ steps.resolve.outputs.tag }}
          # Anchored for the same reason as release.yml: each installer ships
          # with a `<name>.sha256` beside it, and an unanchored pattern would
          # also match `Vayu-x64.exe.sha256`.
          installers-regex: 'Vayu-x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### Submitted to winget-pkgs"
            echo
            echo "- Package: \`athrvk.Vayu\`"
            echo "- Version: \`${{ steps.resolve.outputs.version }}\`"
            echo "- Tag: \`${{ steps.resolve.outputs.tag }}\`"
            echo
            echo "Track the pull request at <https://github.com/microsoft/winget-pkgs/pulls>."
          } >> "$GITHUB_STEP_SUMMARY"
