name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build legs read, the publish job writes. Install scripts, electron-builder,
# vcpkg source builds and brew all run in the build legs, so they hold no token
# that can alter a release; only `publish` has `contents: write`, and it checks
# out and builds nothing.
permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest supported Ubuntu LTS, not ubuntu-latest: a
        # binary runs on the glibc it was linked against and every later one,
        # never an earlier one. 0.37.0 was built on 24.04 and did not start on
        # 22.04 ("version `GLIBC_2.38' not found"). The toolchain step and the
        # glibc check below hold it there; cache-warm.yml warms the same image.
        os: [ubuntu-22.04, windows-latest, macos-latest]
        include:
          - os: ubuntu-22.04
            preset: linux-prod
          - os: windows-latest
            preset: windows-prod
          - os: macos-latest
            preset: macos-prod-arm64
    timeout-minutes: 120
    env:
      VCPKG_COMMIT: '386d7c478221b7ee0c97bfe6ea61dcf65121d564'
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-archives,readwrite'
      SCCACHE_GHA_ENABLED: 'true'
      # v0.17.1's Windows leg reported 18 sccache "Cache errors" where v0.17.0
      # had none. Nothing broke - an sccache error falls through to the real
      # compiler, which is why that build still finished with zero compilation
      # failures - but `--show-stats` only ever prints error *counts*, so the
      # reason was not recoverable from the log afterwards. These two make it
      # recoverable next time.
      #
      # Set at job level, not appended to $GITHUB_ENV beside the launcher vars
      # below, because sccache reads them when its **server** starts, and the
      # server can be up before that step runs. Job-level env is set before any
      # step, which is the only placement that reliably wins the race. That also
      # rules out `runner.temp`, which job-level env cannot see - hence
      # `github.workspace`, which it can. The file is CI-only and sits outside
      # every artifact glob (`app/release/*`, `artifacts/*`), so it cannot end
      # up shipped.
      SCCACHE_ERROR_LOG: '${{ github.workspace }}/sccache-error.log'
      SCCACHE_LOG: 'warn'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            build-essential \
            pkg-config \
            ca-certificates \
            autoconf \
            autoconf-archive \
            automake \
            libtool

      # GCC 13 on 22.04, exported as CC/CXX before vcpkg or CMake runs. See the
      # action for why this is not the runner's own compiler.
      - name: Set up the Linux release toolchain
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-release-toolchain

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        # autoconf-archive and friends are for vcpkg's libsodium, which builds
        # from source through its autotools path and runs autoreconf first.
        # brew's libtool provides glibtoolize, which vcpkg accepts in place of
        # libtoolize.
        run: |
          command -v ninja || brew install ninja
          for pkg in autoconf autoconf-archive automake libtool; do
            brew list --formula "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Cache vcpkg compiled packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.vcpkg-archives
          key: vcpkg-${{ runner.os }}-${{ matrix.os || 'ubuntu-latest' }}-${{ hashFiles('engine/vcpkg.json') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.os || 'ubuntu-latest' }}-${{ hashFiles('engine/vcpkg.json') }}-
            vcpkg-${{ runner.os }}-${{ matrix.os || 'ubuntu-latest' }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'
          vcpkgJsonGlob: 'engine/vcpkg.json'

      # Windows used to skip both of these: sccache-action@v0.0.10 could not
      # install on the Windows Server 2025 + Visual Studio 2026 image GitHub
      # rolled across windows-latest in June 2026, failing its post-step with
      # "Unable to locate executable file: undefined".
      #
      # v0.0.11 fixed it, and this is not being taken on faith - the same two
      # steps ran green on windows-latest in pr-tests.yml, which builds the
      # identical `windows-prod` preset on the identical image. That run
      # installed sccache v0.17.0, put 152 compile requests through it with no
      # compilation failures and no unsupported-compiler calls, and completed
      # its post-step. This job is the same work behind a tag, so the evidence
      # carries; it is only listed here because nothing but a release exercises
      # this file, so a regression would surface at the worst moment.
      #
      # If a release ever fails in these steps, put `if: runner.os != 'Windows'`
      # back on both. The build is slower without sccache but reliable.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure sccache compiler launcher
        shell: bash
        run: |
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"

      # ctest deliberately does NOT run through `lukka/run-cmake`'s `testPreset`
      # here, and every engine-test step in this file is split build-then-ctest
      # for the same reason. The action spawns ctest with an unwritten pipe as
      # stdin, while pr-tests.yml runs it from a plain shell step - so a test
      # that reads or probes stdin behaves differently in the two places and
      # fails *only* at release time, on a tag, with the release half-published.
      # v0.16.0 shipped exactly that failure (fixed engine-side in #582: a
      # bodyless POST now declares CURLOPT_POSTFIELDSIZE 0 rather than letting
      # curl read a body from stdin). The engine is correct under any stdin now,
      # but the environment divergence that hid it until release is what these
      # split steps close: `< /dev/null` on both sides of CI, so the suite sees
      # one stdin everywhere and the next stdin-touching path fails in the pull
      # request that introduces it. See #589. Do not fold these back into the
      # action's testPreset.
      - name: Build engine (arm64)
        if: runner.os == 'macOS'
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/engine/CMakeLists.txt'
          configurePreset: macos-prod-arm64
          buildPreset: macos-prod-arm64
          configurePresetAdditionalArgs: "['-DVAYU_BUILD_TESTS=ON']"

      - name: Run engine tests (arm64)
        if: runner.os == 'macOS'
        working-directory: engine
        shell: bash
        run: ctest --preset macos-prod-arm64 --output-on-failure < /dev/null

      - name: Build engine (x64)
        # Both architectures run ctest now that RateLimiterTest hits an
        # in-process mock instead of httpbin.org (issue #30). x64 still goes
        # through Rosetta on M-series runners, but the remaining tests don't
        # assert on tight wall-clock windows tied to a remote endpoint.
        if: runner.os == 'macOS'
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/engine/CMakeLists.txt'
          configurePreset: macos-prod-x64
          buildPreset: macos-prod-x64
          configurePresetAdditionalArgs: "['-DVAYU_BUILD_TESTS=ON']"

      - name: Run engine tests (x64)
        if: runner.os == 'macOS'
        working-directory: engine
        shell: bash
        run: ctest --preset macos-prod-x64 --output-on-failure < /dev/null

      - name: Create universal binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p engine/build-universal
          lipo -create \
            engine/build-release-arm64/vayu-engine \
            engine/build-release-x64/vayu-engine \
            -output engine/build-universal/vayu-engine
          echo "Universal binary created, verifying architectures:"
          lipo -info engine/build-universal/vayu-engine
          chmod +x engine/build-universal/vayu-engine

      # Guards the whole macOS release, both slices at once: an engine built
      # against a newer SDK than it targets dies at launch on an older Mac with
      # a dyld "Symbol not found", and every other step here would still pass.
      # v0.26.0 shipped that way. See engine/CMakeLists.txt.
      - name: Verify universal binary deployment target (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/check-macos-min-version.sh engine/build-universal/vayu-engine

      - name: Build engine (Non-macOS)
        if: runner.os != 'macOS'
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/engine/CMakeLists.txt'
          configurePreset: ${{ matrix.preset }}
          buildPreset: ${{ matrix.preset }}
          configurePresetAdditionalArgs: "['-DVAYU_BUILD_TESTS=ON']"

      # `shell: bash` on Windows too, matching pr-tests.yml - the redirect has
      # to be the same shell's, or the two paths differ again by the thing this
      # split exists to make identical.
      - name: Run engine tests (Non-macOS)
        if: runner.os != 'macOS'
        working-directory: engine
        shell: bash
        run: ctest --preset ${{ matrix.preset }} --output-on-failure < /dev/null

      # The Linux counterpart of the macOS deployment-target check above, and
      # the same class of bug: a binary linked on a newer distribution than the
      # oldest one supported asks for glibc symbols that distribution does not
      # have, and every other step here still passes. 0.37.0 shipped that way.
      - name: Verify engine glibc floor (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/check-linux-glibc.sh engine/build-release/vayu-engine

      # `if: always()` on purpose: a build that *failed* is the one whose
      # sccache errors are worth reading, and without it this step would be
      # skipped exactly then. It never fails the job - it is diagnostics, and a
      # missing or empty log is the good case, not an error. Steps after this
      # one carry no `always()`, so a failed build still stops here.
      - name: Report sccache errors
        if: always()
        shell: bash
        run: |
          log="${SCCACHE_ERROR_LOG:-}"
          if [ -z "$log" ] || [ ! -s "$log" ]; then
            echo "No sccache errors logged."
            exit 0
          fi
          echo "::group::sccache error log"
          cat "$log"
          echo "::endgroup::"
          # Surfaced as a notice rather than a warning: these fall through to
          # the real compiler, so they cost time and nothing else.
          echo "::notice::sccache logged $(wc -l < "$log" | tr -d ' ') line(s) to its error log - see the 'Report sccache errors' step."

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: app
        run: |
          pnpm run electron:compile
          pnpm run build

      - name: Setup application icons (after build)
        shell: bash
        run: |
          mkdir -p app/build
          # electron-builder's EULA license must be plain text (.txt/.rtf/.html
          # for NSIS, plain text for AppImage). The repo-root AGPL-3.0 LICENSE
          # has no extension, so stage a .txt copy referenced by the config.
          cp LICENSE app/build/license.txt
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Windows: Use .ico file
            cp shared/icon_ico/vayu_icon_256x256.ico app/build/icon.ico
          elif [ "${{ runner.os }}" = "Darwin" ]; then
            # macOS: Use 512x512 PNG (electron-builder converts to ICNS)
            # Remove any existing icons directory to avoid conflicts
            rm -rf app/build/icons
            cp shared/icon_png/vayu_icon_512x512.png app/build/icon.png
            echo "Icon setup for macOS - verifying:"
            file app/build/icon.png
            sips -g pixelWidth -g pixelHeight app/build/icon.png
          else
            # Linux: electron-builder's icon-set resolver only recognizes files
            # named "<size>x<size>.png" (e.g. 512x512.png); the shared icons are
            # prefixed (vayu_icon_512x512.png), so strip the prefix when copying.
            rm -rf app/build/icons
            mkdir -p app/build/icons
            for f in shared/icon_png/vayu_icon_*.png; do
              size=$(basename "$f" | sed -E 's/^vayu_icon_([0-9]+x[0-9]+)\.png$/\1/')
              cp "$f" "app/build/icons/${size}.png"
            done
            echo "Icon setup for Linux - contents of app/build/icons:"
            ls -1 app/build/icons
          fi

      - name: Verify engine has no non-Windows dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --quiet pefile
          python .github/check-windows-deps.py engine/build-release/vayu-engine.exe

      - name: Copy engine binary to resources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $resourcesDir = "app/build/resources/bin"
          New-Item -ItemType Directory -Force -Path $resourcesDir | Out-Null
          # windows-prod uses the Ninja generator (single-config), so the
          # binary lands directly under build-release/ - no Release/ subdir
          # (that's the Visual Studio multi-config layout).
          Copy-Item "engine/build-release/vayu-engine.exe" "$resourcesDir/vayu-engine.exe"

          # No DLLs are copied: windows-prod builds against x64-windows-static
          # with a static MSVC runtime, so the engine is self-contained. The
          # glob that used to live here copied "*.dll" from the build directory,
          # which was wrong in both directions - it swept in gtest.dll and
          # gtest_main.dll (test libraries, shipped to users for two releases)
          # while missing the MSVC runtime entirely, because that never lands in
          # the build directory. The step above proves the binary needs nothing
          # beside it, which is a stronger guarantee than any copy list.

      - name: Copy engine binary to resources (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p app/build/resources/bin
          cp engine/build-universal/vayu-engine app/build/resources/bin/vayu-engine
          chmod +x app/build/resources/bin/vayu-engine
          echo "Universal binary copied, verifying architectures:"
          lipo -info app/build/resources/bin/vayu-engine

      - name: Copy engine binary to resources (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p app/build/resources/bin
          cp engine/build-release/vayu-engine app/build/resources/bin/vayu-engine
          chmod +x app/build/resources/bin/vayu-engine

      - name: Package application
        working-directory: app
        run: pnpm run electron:pack

      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts
          cp app/release/*.AppImage artifacts/ 2>/dev/null || true
          cp app/release/*.deb artifacts/ 2>/dev/null || true
          cp app/release/*.rpm artifacts/ 2>/dev/null || true
          # electron-updater feed metadata - without this the updater never
          # sees new releases.
          cp app/release/latest-linux.yml artifacts/ 2>/dev/null || true
          # Count installers only (the .yml metadata doesn't count as a build).
          # Use find, not `ls <glob>`: under `set -eo pipefail` a non-matching
          # glob (e.g. no .rpm - Linux only builds AppImage+deb) makes ls exit
          # non-zero and aborts the step before the count is ever checked.
          artifact_count=$(find artifacts -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) | wc -l | tr -d ' ')
          if [ "$artifact_count" -eq 0 ]; then
            echo "::error::No Linux artifacts built - AppImage/deb/rpm all missing." >&2
            exit 1
          fi
          ls -lh artifacts/

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $exeFiles = Get-ChildItem app/release/*.exe -ErrorAction SilentlyContinue
          if ($exeFiles.Count -eq 0) {
            Write-Error "No Windows .exe artifact built."
            exit 1
          }
          $exeFiles | ForEach-Object { Copy-Item $_.FullName -Destination artifacts/ }
          # The installer's .blockmap is what makes a Windows update a ranged
          # download instead of the whole 127MB installer: NsisUpdater derives
          # <installer>.blockmap for this release and for the one being upgraded
          # from, and transfers only the blocks that differ. Left behind in
          # app/release/, both fetches 404, the differential path throws, and
          # every update falls back to the full download with nothing but a log
          # line to say so - which is how it went unnoticed for 24 releases. So
          # a missing blockmap fails the release rather than being skipped
          # quietly. Windows is the only platform that needs the file uploaded:
          # the AppImage carries its blockmap appended to its own tail, and
          # macOS notifies rather than downloading.
          $blockMaps = Get-ChildItem app/release/*.exe.blockmap -ErrorAction SilentlyContinue
          if ($blockMaps.Count -eq 0) {
            Write-Error "No .exe.blockmap produced - every Windows update would fall back to the full installer."
            exit 1
          }
          $blockMaps | ForEach-Object { Copy-Item $_.FullName -Destination artifacts/ }
          # electron-updater feed metadata for the NSIS auto-updater.
          Copy-Item app/release/latest.yml -Destination artifacts/ -ErrorAction SilentlyContinue
          Get-ChildItem artifacts

      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts
          cp app/release/*.dmg artifacts/ 2>/dev/null || true
          # find avoids `ls <glob>` aborting the step under `set -eo pipefail`.
          zip_count=$(find app/release -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')
          if [ "$zip_count" -eq 0 ]; then
            echo "::error::No macOS .zip artifact built - the curl installer would 404. Failing the release." >&2
            exit 1
          fi
          cp app/release/*.zip artifacts/
          # electron-updater reads the .zip feed (not the .dmg) on macOS.
          cp app/release/latest-mac.yml artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      # A .sha256 beside every installer, on all three platforms.
      #
      # install.sh verifies a download against this sidecar when one exists -
      # and until now only the macOS zip had one, so the Linux path fetched
      # 160MB over `curl | bash` with nothing to check it against and the
      # verification code was dead. The sidecar is what makes it real, so it is
      # generated for every artifact rather than the one that happened to have
      # it, and a missing one is a release-blocking error rather than a silent
      # skip: a checksum that is sometimes absent is a checksum nobody can rely
      # on. The .yml feeds and the .blockmap are excluded - both are
      # electron-updater's own metadata, and what it assembles from them is
      # verified against the sha512 the feed carries, never against a sidecar
      # nothing would fetch.
      - name: Checksum artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          shopt -s nullglob
          count=0
          for f in artifacts/*; do
            case "$f" in *.yml|*.sha256|*.blockmap) continue ;; esac
            shasum -a 256 "$f" | awk '{print $1}' > "$f.sha256"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No artifacts to checksum - the collect step should have failed first." >&2
            exit 1
          fi
          echo "Checksummed $count artifact(s):"
          for f in artifacts/*.sha256; do printf '  %s  %s\n' "$(cat "$f")" "$(basename "${f%.sha256}")"; done

      - name: Checksum artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts -File | Where-Object { $_.Extension -notin '.yml', '.sha256', '.blockmap' }
          if ($files.Count -eq 0) {
            Write-Error "No artifacts to checksum - the collect step should have failed first."
            exit 1
          }
          foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            # No trailing newline difference to worry about: install.sh reads
            # the first field, and the Unix side writes the same bare hash.
            [System.IO.File]::WriteAllText("$($f.FullName).sha256", "$hash`n")
            Write-Host "  $hash  $($f.Name)"
          }

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ runner.os }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  # The only job with write access. No checkout, no build: it downloads what the
  # build legs produced, attests each asset to this workflow run and tag, and
  # creates the release. `id-token` and `attestations` exist for the attestation
  # alone. A `workflow_dispatch` run stops after `build`, so the pipeline can be
  # exercised on a branch without publishing anything.
  #
  # Verify any download with
  #   gh attestation verify <asset> --repo athrvk/vayu
  publish:
    name: Attest and publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Attest build provenance
        # The .sha256 sidecars and the electron-updater feeds are derived from
        # the installers; the installers, zips and blockmaps are the assets a
        # user runs or the updater assembles.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*
            !artifacts/*.sha256
            !artifacts/*.yml

      # Prefer the curated, hand-written notes committed at .github/release-notes/<tag>.md
      # (Keep a Changelog format, see CLAUDE.md). If that file is absent for this tag,
      # fall back to GitHub's automatically generated PR-based notes so the release is
      # never published with an empty body. There is no checkout here, so the
      # notes file is fetched from the tagged commit through the contents API.
      - name: Resolve release notes
        id: relnotes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="release-notes.md"
          if gh api -H 'Accept: application/vnd.github.raw' \
              "repos/${GITHUB_REPOSITORY}/contents/.github/release-notes/${GITHUB_REF_NAME}.md?ref=${GITHUB_SHA}" \
              > "$notes" 2>/dev/null; then
            echo "Using curated release notes for ${GITHUB_REF_NAME}"
            echo "curated=true" >> "$GITHUB_OUTPUT"
          else
            echo "No curated notes for ${GITHUB_REF_NAME} - falling back to auto-generated notes."
            : > "$notes"
            echo "curated=false" >> "$GITHUB_OUTPUT"
          fi
          # Either way the body names how to check the download. For the
          # auto-generated fallback this footer is followed by GitHub's notes.
          printf '\n\nEvery asset carries a build-provenance attestation: `gh attestation verify <asset> --repo %s`.\n' \
            "$GITHUB_REPOSITORY" >> "$notes"
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            artifacts/*
          fail_on_unmatched_files: true
          # With no curated file the body is only the verify footer, and
          # generate_release_notes appends GitHub's auto notes to it.
          body_path: ${{ steps.relnotes.outputs.path }}
          generate_release_notes: ${{ steps.relnotes.outputs.curated == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Submit the Windows installer to the winget community repository
  # (microsoft/winget-pkgs) as a PR, so `winget install athrvk.Vayu` picks up
  # each new release automatically. This is a SEPARATE job, not a step inside
  # the 3-OS matrix above - an inline step would fire three duplicate PRs.
  #
  # One-time prerequisites (owner's GitHub account) before this does anything:
  #   1. Fork microsoft/winget-pkgs to the athrvk account.
  #   2. Create a *classic* PAT with `public_repo` scope (fine-grained PATs are
  #      NOT supported by the action) and store it as the repo secret
  #      WINGET_TOKEN.
  # Until WINGET_TOKEN exists the submit step is skipped and the job is a green
  # no-op, so landing this ahead of the secret can never fail a release tag.
  #
  # This covers the normal path only: a tag push, with every platform built. To
  # publish a tag this never ran for - a release that predates this job, a
  # re-submission, an older tag - use the "Publish to winget (manual)" workflow
  # (.github/workflows/winget-publish.yml), which submits an existing release
  # without rebuilding anything.
  #
  # `needs: publish` + `success()` means this only runs after the GitHub
  # Release is fully published: `build` builds all three platforms (its
  # fail-fast:false matrix reports success only when every leg passes) and
  # `publish` uploads the assets, incl. Vayu-x64.exe, to the release. Any failed
  # build leaves `publish` skipped and so skips this job.
  publish-winget:
    name: Publish to winget
    needs: publish
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      # The preflight verifies the token and, critically, syncs the fork with
      # microsoft/winget-pkgs. komac branches at upstream's head, so a fork that
      # has fallen behind since the last release cannot have that ref created -
      # and GitHub reports it as a permissions error, which is why v0.16.0 was
      # spent replacing a token that was never the problem. The fork drifts
      # between every release, so this belongs on the automatic path above all.
      #
      # Both steps keep the `env.WINGET_TOKEN != ''` guard the submit step has:
      # this job is a green no-op until the secret exists, so that landing it
      # can never fail a release tag.
      - name: Checkout
        if: env.WINGET_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Preflight and sync the fork
        if: env.WINGET_TOKEN != ''
        uses: ./.github/actions/winget-preflight
        with:
          token: ${{ env.WINGET_TOKEN }}

      - name: Submit manifest to winget-pkgs
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: athrvk.Vayu
          # `version` is intentionally omitted. The action defaults it to the
          # release tag with the leading `v` stripped (v0.10.0 -> 0.10.0);
          # passing github.ref_name explicitly would NOT strip the `v` and would
          # publish a malformed PackageVersion. `fork-user` is likewise omitted
          # and defaults to the repository owner (athrvk), where the fork lives.
          # The trailing `$` is load-bearing, not decoration. Every installer is
          # published alongside a `<name>.sha256`, so an unanchored pattern also
          # matches `Vayu-x64.exe.sha256` and the action would try to publish a
          # 65-byte text file as the installer. Anchored, this matches exactly
          # one of the release's assets.
          installers-regex: 'Vayu-x64\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ env.WINGET_TOKEN }}
          # `max-versions-to-keep` is deliberately UNSET (the action's default
          # is 0 = keep everything, and its cleanup step is guarded by
          # `if: fromJSON(inputs.max-versions-to-keep) > 0`, so unset means the
          # pruning code never runs at all).
          #
          # It used to be 5, to keep a rollback window without leaving known
          # broken builds on offer - 0.10.0 ships an engine that cannot start
          # without the Visual C++ redistributable. That intent was fine. The
          # implementation is not: **the action deletes the NEWEST versions
          # instead of the oldest.**
          #
          # The v0.17.0 release proved it, and the damage was real rather than
          # theoretical. With 0.10.0, 0.12.0, 0.13.0, 0.14.0, 0.15.0 and 0.16.0
          # live, the cleanup step logged "Versions to delete: 0.15.0, 0.16.0"
          # and filed microsoft/winget-pkgs#417718 and #417719 to remove the two
          # most recent releases, while leaving the broken 0.10.0 exactly where
          # it was - the precise opposite of why the cap was set. #417718 was
          # approved and merged, so 0.15.0 is gone from winget. #417719 was
          # stopped only because a moderator noticed it was deleting the highest
          # version in the index and asked why.
          #
          # The cause is upstream and is not ours to patch. The step does:
          #
          #   $Versions = komac list-versions ... | ConvertFrom-Json -NoEnumerate |
          #               Sort-Object $ToNatural -Descending
          #   $VersionsToDelete = $Versions[(5 - 1)..($Versions.Count - 1)]
          #
          # `-NoEnumerate` (added in a3ac67b for issue #307) writes the array to
          # the pipeline as a single object, so `Sort-Object` receives exactly
          # one item. Sorting one item is a no-op: `-Descending` never applies
          # and the list stays in komac's own ascending order, so slicing the
          # tail takes the newest. Upstream knows - issue #323 - and fixed it in
          # 19e706d on 2025-05-29 by re-enumerating with `$(...)`; the author's
          # own comment there describes exactly this ("versions weren't getting
          # sorted properly due to which it was picking up most recent versions
          # instead of the oldest versions").
          #
          # **Do not read that issue as "resolved, safe to re-enable."** It is
          # closed as completed, which is the trap: the fix landed on `main` and
          # was never released. `v2` is the repository's only tag, it is
          # lightweight, and it still points at 4ffc788 ("docs(funding): remove
          # ko-fi", 2024-11-27) - six months *older* than the fix. Verified, not
          # assumed:
          #
          #   git merge-base --is-ancestor 19e706d v2   # non-zero: not in v2
          #
          # So anyone pinning `@v2` with a non-zero cap is silently deleting
          # their own newest releases, 14 months after the bug was "fixed"; at
          # the time of writing two other packages in winget-pkgs are doing it
          # too. That command, against whatever ref this job pins, is the check
          # to run before trusting the cap again.
          #
          # Options considered: pin the action to the fixed commit and keep the
          # cap, or turn the cap off. Turning it off wins for now - pinning
          # would put unreleased upstream `main` on the release path to buy a
          # convenience, and a stale extra version on winget costs nothing next
          # to a run that removes the version users are meant to install.
          #
          # Consequence, stated plainly rather than left to be discovered: the
          # winget index now grows without bound, and 0.10.0 and 0.12.0 stay
          # published until someone files a removal by hand - which is what the
          # manual workflow in winget-publish.yml is for. Do not restore this
          # input until upstream cuts a release containing 19e706d, or moves the
          # `v2` tag onto it. Re-pointing this `uses:` at a newer commit is the
          # other way, and it needs the same evidence: check that the cleanup
          # step re-enumerates before `Sort-Object` again.
