# Path-based labels for pull requests, applied by .github/workflows/labeler.yml.
#
# Labels are not created on demand: every key here must already exist in the
# repository or the run fails on it. All label names below must be pre-created
# in the repository settings.
#
# Overlap is expected and fine. A change to `.github/release-notes/*.md` is both
# `ci` and `documentation`, and a release bump touching both trees earns
# `component:app`, `component:engine` and `component:build` at once.
# These describe where a change lands, not what kind of change it is, so `type:bug`,
# `type:enhancement` and the rest stay manual.

# Component labels - where the change lands
component:app:
  - changed-files:
      - any-glob-to-any-file: 'app/**'

component:engine:
  - changed-files:
      - any-glob-to-any-file: 'engine/**'

# A subset of `component:engine`, so a database change earns both labels.
# This is intentional: the point of a finer label is to subset while keeping
# the parent category. The store is one translation unit plus header, test and
# schema doc, so this is an explicit file list rather than a directory.
component:database:
  - changed-files:
      - any-glob-to-any-file:
          - 'engine/src/db/**'
          - 'engine/include/vayu/db/**'
          - 'engine/tests/db_test.cpp'
          - 'docs/engine/db-schema.md'

component:ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

# The build system spans both trees and the repo root. This is an explicit file
# list rather than a directory: version manifests, CMake configuration,
# dependency manifests, and build script.
component:build:
  - changed-files:
      - any-glob-to-any-file:
          - 'build.py'
          - 'VERSION'
          - 'engine/CMakeLists.txt'
          - 'engine/CMakePresets.json'
          - 'engine/vcpkg.json'
          - 'app/package.json'
          - 'app/pnpm-lock.yaml'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/*.md'

# Area labels - sub-areas within engine
area:http:
  - changed-files:
      - any-glob-to-any-file:
          - 'engine/src/http/**'
          - 'engine/include/vayu/http/**'

area:auth:
  - changed-files:
      - any-glob-to-any-file:
          - 'engine/src/core/auth*'
          - 'docs/engine/architecture.md'

area:metrics:
  - changed-files:
      - any-glob-to-any-file:
          - 'engine/src/core/metrics_collector*'
          - 'docs/engine/api-reference.md'

area:scripting:
  - changed-files:
      - any-glob-to-any-file:
          - 'engine/src/runtime/**'
          - 'engine/include/vayu/runtime/**'
          - 'docs/engine/scripting.md'
