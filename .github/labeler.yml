# Path-based labels for pull requests, applied by .github/workflows/labeler.yml.
#
# Labels are not created on demand: every key here must already exist in the
# repository or the run fails on it. All label names below must be pre-created
# in the repository settings.
#
# Overlap is expected and fine. A change to `.github/release-notes/*.md` is both
# `ci` and `documentation`, and a release bump touching both trees earns
# `component:app`, `component:engine` and `component:build` at once.
# These describe where a change lands, not what kind of change it is, so `type:bug`,
# `type:enhancement` and the rest stay manual.

# Component labels - where the change lands
component:app:
  - changed-files:
      - any-glob-to-any-file: 'app/**'

component:engine:
  - changed-files:
      - any-glob-to-any-file: 'engine/**'

# A subset of `component:engine`, so a database change earns both labels.
# This is intentional: the point of a finer label is to subset while keeping
# the parent category. The store is one translation unit plus header and
# tests, so this is an explicit file list rather than a directory. Kept
# strictly inside `engine/**` - a doc-only change to db-schema.md is
# `documentation`, not `component:database`, so it doesn't earn a component
# label its content never touched.
component:database:
  - changed-files:
      - any-glob-to-any-file:
          - 'engine/src/db/**'
          - 'engine/include/vayu/db/**'
          - 'engine/tests/db_test.cpp'
          - 'engine/tests/db_concurrency_test.cpp'

component:ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

# The build system spans both trees and the repo root. This is an explicit file
# list rather than a directory: version manifests, CMake configuration,
# dependency manifests, and build script. `scripts/**` covers the pre-commit
# hook and build/test tooling.
component:build:
  - changed-files:
      - any-glob-to-any-file:
          - 'build.py'
          - 'VERSION'
          - 'engine/CMakeLists.txt'
          - 'engine/CMakePresets.json'
          - 'engine/vcpkg.json'
          - 'app/package.json'
          - 'app/pnpm-lock.yaml'
          - 'scripts/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/*.md'

# Area labels - sub-areas within engine. Kept strictly inside `engine/**`,
# same reasoning as `component:database`: a doc-only change earns
# `documentation`, not an `area:*` label whose code it didn't touch. Auth and
# oauth files live under `engine/src/http/`, so `area:auth` overlaps
# `area:http` on those files - intentional, same subset pattern as
# `component:database` inside `component:engine`.
area:http:
  - changed-files:
      - any-glob-to-any-file:
          - 'engine/src/http/**'
          - 'engine/include/vayu/http/**'

area:auth:
  - changed-files:
      - any-glob-to-any-file:
          - 'engine/src/http/auth_resolver*'
          - 'engine/src/http/oauth*'
          - 'engine/src/http/routes/oauth*'
          - 'engine/include/vayu/http/auth_resolver*'
          - 'engine/include/vayu/http/oauth*'
          - 'engine/tests/auth_resolver_test.cpp'
          - 'engine/tests/oauth_authorize_test.cpp'
          - 'engine/tests/oauth_client_test.cpp'
          - 'engine/tests/oauth_route_test.cpp'

area:metrics:
  - changed-files:
      - any-glob-to-any-file:
          - 'engine/src/core/metrics_collector*'
          - 'engine/include/vayu/core/metrics_collector*'
          - 'engine/src/http/routes/metrics.cpp'
          - 'engine/src/utils/metrics_helper*'
          - 'engine/include/vayu/utils/metrics_helper*'
          - 'engine/tests/metrics_collector_test.cpp'
          - 'engine/tests/metrics_helper_test.cpp'

area:scripting:
  - changed-files:
      - any-glob-to-any-file:
          - 'engine/src/runtime/**'
          - 'engine/include/vayu/runtime/**'
